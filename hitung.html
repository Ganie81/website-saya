
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#09090b">
<title>KALKULATOR</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  background:#09090b;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

body{padding:14px}

.container{
  width:100%;
  max-width:900px;
  margin:0 auto;
}

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:18px;
}

.header h1{
  font-size:clamp(22px,5vw,34px);
  margin:0;
  letter-spacing:1px;
}

.home{
  color:#fff;
  background:#27272a;
  border:1px solid #3f3f46;
  border-radius:12px;
  padding:12px 18px;
  text-decoration:none;
  font-size:16px;
  font-weight:bold;
}

.calculator{
  background:#18181b;
  border:1px solid #27272a;
  border-radius:24px;
  padding:clamp(14px,3vw,26px);
  box-shadow:0 12px 40px #0008;
}

.display{
  background:#09090b;
  border:1px solid #27272a;
  border-radius:18px;
  min-height:170px;
  padding:18px;
  margin-bottom:18px;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  overflow:hidden;
}

.expression{
  min-height:30px;
  color:#a1a1aa;
  font-size:clamp(16px,3.5vw,25px);
  text-align:right;
  overflow-wrap:anywhere;
  margin-bottom:12px;
}

.result{
  width:100%;
  font-size:clamp(40px,10vw,76px);
  font-weight:bold;
  text-align:right;
  white-space:nowrap;
  overflow-x:auto;
  color:#fff;
}

.buttons{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:10px;
}

button{
  border:0;
  border-radius:16px;
  min-height:clamp(64px,12vw,100px);
  font-size:clamp(23px,5vw,36px);
  font-weight:bold;
  color:#fff;
  background:#27272a;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}

button:active{transform:scale(.97)}

button.function{background:#3f3f46}
button.operator{background:#2563eb}
button.equal{background:#16a34a}
button.zero{grid-column:span 2}

.history-box{
  margin-top:20px;
  background:#18181b;
  border:1px solid #27272a;
  border-radius:18px;
  padding:18px;
}

.history-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
}

.history-head h2{
  margin:0;
  font-size:20px;
}

.clear-history{
  background:#3f3f46;
  min-height:42px;
  border-radius:10px;
  padding:8px 14px;
  font-size:14px;
}

.history-list{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.history-item{
  padding:13px;
  background:#09090b;
  border:1px solid #27272a;
  border-radius:12px;
  overflow-wrap:anywhere;
}

.history-expression{
  color:#a1a1aa;
  font-size:15px;
  margin-bottom:6px;
}

.history-result{
  color:#4ade80;
  font-size:22px;
  font-weight:bold;
  text-align:right;
}

.empty-history{
  color:#71717a;
  text-align:center;
  padding:18px 5px;
}

@media(max-width:420px){
  body{padding:9px}
  .calculator{padding:10px}
  .buttons{gap:7px}
  button{border-radius:12px}
  .display{padding:13px;min-height:145px}
}
</style>
</head>

<body>
<div class="container">

  <div class="header">
    <h1>KALKULATOR</h1>
    <a class="home" href="cek.html">⌂ HOME</a>
  </div>

  <div class="calculator">
    <div class="display">
      <div class="expression" id="expression">Siap menghitung</div>
      <div class="result" id="result">0</div>
    </div>

    <div class="buttons">
      <button class="function" onclick="clearAll()">AC</button>
      <button class="function" onclick="clearEntry()">CE</button>
      <button class="function" onclick="backspace()">⌫</button>
      <button class="operator" onclick="chooseOperator('/')">÷</button>

      <button onclick="inputNumber('7')">7</button>
      <button onclick="inputNumber('8')">8</button>
      <button onclick="inputNumber('9')">9</button>
      <button class="operator" onclick="chooseOperator('*')">×</button>

      <button onclick="inputNumber('4')">4</button>
      <button onclick="inputNumber('5')">5</button>
      <button onclick="inputNumber('6')">6</button>
      <button class="operator" onclick="chooseOperator('-')">−</button>

      <button onclick="inputNumber('1')">1</button>
      <button onclick="inputNumber('2')">2</button>
      <button onclick="inputNumber('3')">3</button>
      <button class="operator" onclick="chooseOperator('+')">+</button>

      <button class="function" onclick="toggleSign()">±</button>
      <button onclick="inputNumber('0')">0</button>
      <button onclick="inputDecimal()">,</button>
      <button class="equal" onclick="equals()">=</button>

      <button class="function" onclick="percentage()">%</button>
      <button class="function" onclick="squareRoot()">√</button>
      <button class="function" onclick="square()">x²</button>
      <button class="function" onclick="reciprocal()">1/x</button>
    </div>
  </div>

  <div class="history-box">
    <div class="history-head">
      <h2>RIWAYAT PERHITUNGAN</h2>
      <button class="clear-history" onclick="clearHistory()">Hapus</button>
    </div>
    <div class="history-list" id="historyList">
      <div class="empty-history">Belum ada riwayat</div>
    </div>
  </div>

</div>

<script>
let current = '0';
let previous = null;
let operator = null;
let waiting = false;
let justCalculated = false;
let expressionText = '';
let history = [];

const symbols = {
  '+': '+',
  '-': '−',
  '*': '×',
  '/': '÷'
};

const resultDisplay = document.getElementById('result');
const expressionDisplay = document.getElementById('expression');
const historyList = document.getElementById('historyList');

function formatNumber(value){
  if(!Number.isFinite(value)) return 'Error';
  if(Object.is(value,-0)) value = 0;
  return String(Number(value.toPrecision(12))).replace('.', ',');
}

function formatCurrent(){
  if(current === 'Error') return 'Error';
  return current.replace('.', ',');
}

function updateDisplay(){
  resultDisplay.textContent = formatCurrent();
  expressionDisplay.textContent = expressionText || 'Siap menghitung';
}

function updateExpressionNumber(){
  if(!expressionText || operator === null || waiting) return;

  const lastSpace = expressionText.lastIndexOf(' ');

  if(lastSpace >= 0){
    expressionText =
      expressionText.substring(0,lastSpace + 1) + formatCurrent();
  }else{
    expressionText = formatCurrent();
  }
}

function inputNumber(number){
  if(current === 'Error') clearAll(false);

  if(justCalculated){
    current = number;
    previous = null;
    operator = null;
    waiting = false;
    justCalculated = false;
    expressionText = number;
    updateDisplay();
    return;
  }

  if(waiting){
    current = number;
    waiting = false;

    if(expressionText){
      expressionText += ' ' + formatCurrent();
    }else{
      expressionText = formatCurrent();
    }
  }else{
    current = current === '0' ? number : current + number;
    updateExpressionNumber();

    if(!expressionText){
      expressionText = formatCurrent();
    }
  }

  updateDisplay();
}

function inputDecimal(){
  if(current === 'Error') clearAll(false);

  if(justCalculated){
    current = '0.';
    expressionText = '0,';
    previous = null;
    operator = null;
    waiting = false;
    justCalculated = false;
    updateDisplay();
    return;
  }

  if(waiting){
    current = '0.';
    waiting = false;
    expressionText += ' 0,';
  }else if(!current.includes('.')){
    current += '.';
    updateExpressionNumber();

    if(!expressionText){
      expressionText = '0,';
    }
  }

  updateDisplay();
}

function calculate(a,b,op){
  switch(op){
    case '+': return a + b;
    case '-': return a - b;
    case '*': return a * b;
    case '/': return b === 0 ? NaN : a / b;
    default: return b;
  }
}

function chooseOperator(nextOperator){
  if(current === 'Error') return;

  if(justCalculated){
    expressionText = formatCurrent();
    previous = Number(current);
    operator = null;
    waiting = false;
    justCalculated = false;
  }

  if(operator !== null && !waiting){
    const calculated = calculate(
      Number(previous),
      Number(current),
      operator
    );

    if(!Number.isFinite(calculated)){
      current = 'Error';
      expressionText = 'Tidak bisa dibagi dengan nol';
      previous = null;
      operator = null;
      waiting = true;
      updateDisplay();
      return;
    }

    current = String(Number(calculated.toPrecision(12)));
    previous = Number(current);
  }else if(operator === null){
    previous = Number(current);

    if(!expressionText){
      expressionText = formatCurrent();
    }
  }

  if(waiting && operator !== null){
    const lastSpace = expressionText.lastIndexOf(' ');
    expressionText =
      expressionText.substring(0,lastSpace) +
      ' ' + symbols[nextOperator];
  }else{
    expressionText += ' ' + symbols[nextOperator];
  }

  operator = nextOperator;
  waiting = true;
  updateDisplay();
}

function equals(){
  if(operator === null || waiting || current === 'Error') return;

  const originalExpression = expressionText;
  const calculated = calculate(
    Number(previous),
    Number(current),
    operator
  );

  if(!Number.isFinite(calculated)){
    current = 'Error';
    expressionText = 'Tidak bisa dibagi dengan nol';
    previous = null;
    operator = null;
    waiting = true;
    updateDisplay();
    return;
  }

  history.unshift({
    expression: originalExpression,
    result: formatNumber(calculated)
  });

  if(history.length > 100) history.pop();

  current = String(Number(calculated.toPrecision(12)));
  expressionText = originalExpression + ' =';
  previous = null;
  operator = null;
  waiting = true;
  justCalculated = true;

  renderHistory();
  updateDisplay();
}

function clearAll(clearHistoryToo = true){
  current = '0';
  previous = null;
  operator = null;
  waiting = false;
  justCalculated = false;
  expressionText = '';

  if(clearHistoryToo){
    history = [];
    renderHistory();
  }

  updateDisplay();
}

function clearEntry(){
  current = '0';

  if(justCalculated){
    expressionText = '';
    justCalculated = false;
    previous = null;
    operator = null;
    waiting = false;
  }else{
    updateExpressionNumber();
  }

  updateDisplay();
}

function backspace(){
  if(waiting || justCalculated || current === 'Error'){
    if(current === 'Error') clearAll(false);
    return;
  }

  if(current.length > 1){
    current = current.slice(0,-1);
    if(current === '-') current = '0';
  }else{
    current = '0';
  }

  updateExpressionNumber();
  updateDisplay();
}

function toggleSign(){
  if(current === 'Error') return;

  if(Number(current) !== 0){
    current = String(Number(current) * -1);
  }

  if(justCalculated){
    expressionText = formatCurrent();
  }else{
    updateExpressionNumber();
  }

  updateDisplay();
}

function percentage(){
  if(current === 'Error') return;

  current = String(Number(current) / 100);

  if(justCalculated){
    expressionText = formatCurrent();
  }else{
    updateExpressionNumber();
  }

  updateDisplay();
}

function applyUnary(label, fn){
  if(current === 'Error') return;

  const value = Number(current);
  const calculated = fn(value);

  if(!Number.isFinite(calculated)){
    current = 'Error';
    expressionText = 'Perhitungan tidak valid';
    updateDisplay();
    return;
  }

  const oldValue = formatCurrent();
  current = String(Number(calculated.toPrecision(12)));

  if(operator !== null && !waiting){
    updateExpressionNumber();
  }else{
    expressionText = label + '(' + oldValue + ')';
  }

  justCalculated = false;
  updateDisplay();
}

function squareRoot(){
  applyUnary('√', value => value < 0 ? NaN : Math.sqrt(value));
}

function square(){
  applyUnary('kuadrat', value => value * value);
}

function reciprocal(){
  applyUnary('1/', value => value === 0 ? NaN : 1 / value);
}

function clearHistory(){
  history = [];
  renderHistory();
}

function renderHistory(){
  if(history.length === 0){
    historyList.innerHTML =
      '<div class="empty-history">Belum ada riwayat</div>';
    return;
  }

  historyList.replaceChildren();

  history.forEach(item => {
    const card = document.createElement('div');
    card.className = 'history-item';

    const expression = document.createElement('div');
    expression.className = 'history-expression';
    expression.textContent = item.expression + ' ' + item.result;

    const result = document.createElement('div');
    result.className = 'history-result';
    result.textContent = '= ' + item.result;

    card.appendChild(expression);
    card.appendChild(result);
    historyList.appendChild(card);
  });
}

document.addEventListener('keydown', event => {
  const key = event.key;

  if(key >= '0' && key <= '9'){
    inputNumber(key);
  }else if(key === '.' || key === ','){
    inputDecimal();
  }else if(['+','-','*','/'].includes(key)){
    chooseOperator(key);
  }else if(key === 'Enter' || key === '='){
    event.preventDefault();
    equals();
  }else if(key === 'Backspace'){
    backspace();
  }else if(key === 'Escape'){
    clearAll();
  }else if(key === '%'){
    percentage();
  }
});

updateDisplay();
renderHistory();
</script>
</body>
</html>
