<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Upload Defect Flat</title>

<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;

    font-family:Arial,sans-serif;

    background:
        linear-gradient(
            145deg,
            #eef5fb,
            #dce8f3
        );

    min-height:100vh;

    color:#172b3a;

}


/* =====================================================
   HEADER
===================================================== */

.header{

    background:
        linear-gradient(
            135deg,
            #0d47a1,
            #1565c0,
            #1976d2
        );

    color:white;

    padding:20px 16px;

    text-align:center;

    box-shadow:
        0 5px 15px rgba(0,0,0,.20);

}


.header h1{

    margin:0;

    font-size:24px;

    font-weight:900;

}


.header p{

    margin:6px 0 0;

    font-size:12px;

    opacity:.9;

}


/* =====================================================
   CONTAINER
===================================================== */

.container{

    max-width:900px;

    margin:auto;

    padding:18px 14px 40px;

}


/* =====================================================
   UPLOAD CARD
===================================================== */

.upload-card{

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #edf6ff
        );

    border-radius:18px;

    padding:20px;

    box-shadow:
        0 8px 22px rgba(0,0,0,.12);

    border:
        1px solid rgba(30,90,150,.18);

}


/* =====================================================
   TITLE
===================================================== */

.card-title{

    font-size:18px;

    font-weight:900;

    color:#0d47a1;

    margin-bottom:6px;

}


.card-subtitle{

    font-size:12px;

    color:#607d8b;

    margin-bottom:20px;

}


/* =====================================================
   FILE INPUT
===================================================== */

.file-box{

    border:
        2px dashed #1976d2;

    border-radius:14px;

    padding:25px 15px;

    text-align:center;

    background:
        rgba(33,150,243,.05);

}


.file-box input{

    width:100%;

    margin-top:12px;

}


/* =====================================================
   STATUS
===================================================== */

.status{

    margin-top:15px;

    padding:11px 13px;

    border-radius:10px;

    background:
        rgba(13,71,161,.08);

    font-size:12px;

    font-weight:700;

}


/* =====================================================
   BUTTON
===================================================== */

.btn{

    width:100%;

    margin-top:15px;

    padding:13px;

    border:none;

    border-radius:11px;

    background:
        linear-gradient(
            135deg,
            #0d47a1,
            #1976d2
        );

    color:white;

    font-size:14px;

    font-weight:900;

    cursor:pointer;

    box-shadow:
        0 5px 12px rgba(13,71,161,.25);

}


.btn:disabled{

    opacity:.5;

    cursor:not-allowed;

}


/* =====================================================
   PREVIEW
===================================================== */

.preview{

    margin-top:20px;

    overflow:auto;

    border-radius:12px;

    border:1px solid #c8d8e6;

}


.preview table{

    width:100%;

    border-collapse:collapse;

    min-width:700px;

}


.preview th{

    background:#0d47a1;

    color:white;

    padding:9px;

    font-size:11px;

    white-space:nowrap;

}


.preview td{

    padding:8px;

    border-bottom:1px solid #dbe5ed;

    font-size:11px;

    white-space:nowrap;

}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:600px){

    .header h1{
        font-size:21px;
    }

    .upload-card{
        padding:16px;
    }

}

</style>

</head>


<body>


<div class="header">

    <h1>Upload Defect Flat</h1>

    <p>
        Input data Defect Flat ke Dashboard
    </p>

</div>


<div class="container">


    <div class="upload-card">


        <div class="card-title">
            📤 Upload Data
        </div>


        <div class="card-subtitle">

            Pilih file data Defect Flat untuk
            diproses sebelum dikirim ke sistem.

        </div>


        <div class="file-box">

            <strong>
                Pilih File
            </strong>

            <br>

            <small>
                Format CSV
            </small>


            <input
                type="file"
                id="fileInput"
                accept=".csv,text/csv"
            >

        </div>


        <div
            id="status"
            class="status"
        >
            Belum ada file dipilih.
        </div>


        <button
            id="btnUpload"
            class="btn"
            disabled
        >
            UPLOAD DATA
        </button>


        <div
            id="preview"
            class="preview"
            style="display:none;"
        >

        </div>


    </div>


</div>


<script>

const fileInput =
    document.getElementById("fileInput");

const btnUpload =
    document.getElementById("btnUpload");

const status =
    document.getElementById("status");

const preview =
    document.getElementById("preview");


fileInput.addEventListener(
    "change",
    function(){

        if(!this.files.length){

            btnUpload.disabled = true;

            status.textContent =
                "Belum ada file dipilih.";

            preview.style.display =
                "none";

            preview.innerHTML = "";

            return;

        }


        const file =
            this.files[0];


        if(
            !file.name.toLowerCase().endsWith(".csv")
        ){

            btnUpload.disabled = true;

            status.textContent =
                "❌ File harus berformat CSV.";

            preview.style.display =
                "none";

            preview.innerHTML = "";

            return;

        }


        status.textContent =
            "⏳ Membaca file: " +
            file.name;


        btnUpload.disabled = true;


        const reader =
            new FileReader();


        reader.onload =
            function(event){

                try{

                    const text =
                        event.target.result;


                    const rows =
                        parseCSV(text);


                    if(
                        !rows.length
                    ){

                        throw new Error(
                            "Data CSV kosong."
                        );

                    }


                    renderPreview(rows);


                    status.textContent =
                        "✅ File berhasil dibaca • " +
                        rows.length +
                        " baris";


                    btnUpload.disabled =
                        false;

                }

                catch(error){

                    console.error(error);


                    status.textContent =
                        "❌ Gagal membaca CSV: " +
                        error.message;


                    btnUpload.disabled =
                        true;


                    preview.style.display =
                        "none";

                }

            };


        reader.onerror =
            function(){

                status.textContent =
                    "❌ File tidak dapat dibaca.";

                btnUpload.disabled =
                    true;

            };


        reader.readAsText(
            file,
            "UTF-8"
        );

    }
);


/* =====================================================
   PARSE CSV
===================================================== */

function parseCSV(text){

    const rows = [];

    let row = [];

    let cell = "";

    let insideQuotes = false;


    for(
        let i = 0;
        i < text.length;
        i++
    ){

        const char =
            text[i];

        const next =
            text[i + 1];


        if(char === '"'){

            if(
                insideQuotes &&
                next === '"'
            ){

                cell += '"';

                i++;

            }else{

                insideQuotes =
                    !insideQuotes;

            }

            continue;

        }


        if(
            char === "," &&
            !insideQuotes
        ){

            row.push(cell);

            cell = "";

            continue;

        }


        if(
            (char === "\n" ||
             char === "\r") &&
            !insideQuotes
        ){

            if(
                char === "\r" &&
                next === "\n"
            ){

                i++;

            }


            row.push(cell);

            cell = "";


            if(
                row.some(function(value){

                    return String(value)
                        .trim() !== "";

                })
            ){

                rows.push(row);

            }


            row = [];

            continue;

        }


        cell += char;

    }


    if(
        cell !== "" ||
        row.length
    ){

        row.push(cell);

    }


    if(
        row.some(function(value){

            return String(value)
                .trim() !== "";

        })
    ){

        rows.push(row);

    }


    return rows;

}


/* =====================================================
   PREVIEW CSV
===================================================== */

function renderPreview(rows){

    const maxPreviewRows =
        Math.min(rows.length,11);


    let html =
        "<table>";


    /* HEADER */

    html +=
        "<thead><tr>";


    rows[0].forEach(
        function(header){

            html +=
                "<th>" +
                escapeHtml(header) +
                "</th>";

        }
    );


    html +=
        "</tr></thead>";


    /* DATA */

    html +=
        "<tbody>";


    for(
        let i = 1;
        i < maxPreviewRows;
        i++
    ){

        html +=
            "<tr>";


        rows[i].forEach(
            function(value){

                html +=
                    "<td>" +
                    escapeHtml(value) +
                    "</td>";

            }
        );


        html +=
            "</tr>";

    }


    html +=
        "</tbody></table>";


    preview.innerHTML =
        html;


    preview.style.display =
        "block";

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

    return String(
        value == null ? "" : value
    )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

</script>


</body>

</html>
