<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Upload Defect Flat</title>

<!-- =====================================================
     SHEETJS
     Untuk membaca file XLS / XLSX langsung di browser
===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>


<style>

*{
    box-sizing:border-box;
}


body{

    margin:0;

    font-family:Arial,sans-serif;

    background:
        radial-gradient(
            circle at top left,
            rgba(255,255,255,.75),
            transparent 35%
        ),
        linear-gradient(
            145deg,
            #eef5fb,
            #dce8f3
        );

    min-height:100vh;

    color:#172b3a;

}


/* =====================================================
   HEADER
===================================================== */

.header{

    background:
        linear-gradient(
            135deg,
            #0d47a1,
            #1565c0,
            #1976d2
        );

    color:white;

    padding:20px 16px;

    text-align:center;

    box-shadow:
        0 5px 15px rgba(0,0,0,.20);

}


.header h1{

    margin:0;

    font-size:24px;

    font-weight:900;

}


.header p{

    margin:6px 0 0;

    font-size:12px;

    opacity:.9;

}


/* =====================================================
   CONTAINER
===================================================== */

.container{

    max-width:1000px;

    margin:auto;

    padding:
        18px
        14px
        40px;

}


/* =====================================================
   CARD
===================================================== */

.upload-card{

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #edf6ff
        );

    border-radius:18px;

    padding:20px;

    box-shadow:
        0 8px 22px
        rgba(0,0,0,.12);

    border:
        1px solid
        rgba(30,90,150,.18);

}


/* =====================================================
   TITLE
===================================================== */

.card-title{

    font-size:18px;

    font-weight:900;

    color:#0d47a1;

    margin-bottom:6px;

}


.card-subtitle{

    font-size:12px;

    color:#607d8b;

    margin-bottom:20px;

    line-height:1.5;

}


/* =====================================================
   FILE BOX
===================================================== */

.file-box{

    border:
        2px dashed
        #1976d2;

    border-radius:14px;

    padding:28px 15px;

    text-align:center;

    background:
        rgba(33,150,243,.05);

}


.file-box strong{

    font-size:16px;

    color:#0d47a1;

}


.file-box small{

    color:#607d8b;

}


.file-box input{

    width:100%;

    margin-top:15px;

    font-size:13px;

}


/* =====================================================
   INFO
===================================================== */

.info-grid{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:10px;

    margin-top:15px;

}


.info-box{

    background:
        rgba(13,71,161,.07);

    border-radius:11px;

    padding:12px;

    text-align:center;

}


.info-label{

    font-size:10px;

    color:#607d8b;

    font-weight:700;

}


.info-value{

    margin-top:4px;

    font-size:17px;

    font-weight:900;

    color:#0d47a1;

}


/* =====================================================
   STATUS
===================================================== */

.status{

    margin-top:15px;

    padding:11px 13px;

    border-radius:10px;

    background:
        rgba(13,71,161,.08);

    font-size:12px;

    font-weight:700;

    line-height:1.5;

}


/* =====================================================
   BUTTON
===================================================== */

.btn{

    width:100%;

    margin-top:15px;

    padding:13px;

    border:none;

    border-radius:11px;

    background:
        linear-gradient(
            135deg,
            #0d47a1,
            #1976d2
        );

    color:white;

    font-size:14px;

    font-weight:900;

    cursor:pointer;

    box-shadow:
        0 5px 12px
        rgba(13,71,161,.25);

}


.btn:disabled{

    opacity:.5;

    cursor:not-allowed;

}


/* =====================================================
   SECOND BUTTON
===================================================== */

.btn-reset{

    background:
        linear-gradient(
            135deg,
            #546e7a,
            #78909c
        );

}


/* =====================================================
   PREVIEW
===================================================== */

.preview{

    margin-top:20px;

    overflow:auto;

    border-radius:12px;

    border:
        1px solid
        #c8d8e6;

    max-height:520px;

    background:white;

}


.preview table{

    width:100%;

    border-collapse:collapse;

    min-width:900px;

}


.preview th{

    position:sticky;

    top:0;

    z-index:2;

    background:#0d47a1;

    color:white;

    padding:9px;

    font-size:11px;

    white-space:nowrap;

}


.preview td{

    padding:8px;

    border-bottom:
        1px solid
        #dbe5ed;

    font-size:11px;

    white-space:nowrap;

}


/* =====================================================
   WARNING
===================================================== */

.warning{

    margin-top:15px;

    padding:12px;

    border-radius:10px;

    background:
        #fff3cd;

    color:
        #856404;

    border:
        1px solid
        #ffe69c;

    font-size:12px;

    font-weight:700;

    line-height:1.5;

}


/* =====================================================
   SUCCESS
===================================================== */

.success{

    background:
        #d1e7dd;

    color:
        #0f5132;

    border:
        1px solid
        #badbcc;

}


/* =====================================================
   ERROR
===================================================== */

.error{

    background:
        #f8d7da;

    color:
        #842029;

    border:
        1px solid
        #f5c2c7;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .header h1{

        font-size:21px;

    }


    .upload-card{

        padding:16px;

    }


    .info-grid{

        grid-template-columns:
            1fr 1fr 1fr;

        gap:7px;

    }


    .info-value{

        font-size:15px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<div class="header">

    <h1>
        Upload Defect Flat
    </h1>

    <p>
        Membaca data XLS / XLSX langsung dari perangkat
    </p>

</div>



<div class="container">


<div class="upload-card">


    <div class="card-title">
        📊 Upload Data Excel
    </div>


    <div class="card-subtitle">

        Pilih file Excel Defect Flat.
        Data akan dibaca langsung di browser
        tanpa menggunakan Apps Script.

    </div>



    <!-- =================================================
         FILE
    ================================================= -->

    <div class="file-box">

        <strong>
            📁 Pilih File Excel
        </strong>

        <br>

        <small>
            Format yang didukung: XLS / XLSX
        </small>


        <input
            type="file"
            id="fileInput"
            accept=".xls,.xlsx,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
        >

    </div>



    <!-- =================================================
         INFO
    ================================================= -->

    <div class="info-grid">


        <div class="info-box">

            <div class="info-label">
                FILE
            </div>

            <div
                class="info-value"
                id="fileName">
                -
            </div>

        </div>


        <div class="info-box">

            <div class="info-label">
                SHEET
            </div>

            <div
                class="info-value"
                id="sheetName">
                -
            </div>

        </div>


        <div class="info-box">

            <div class="info-label">
                DATA
            </div>

            <div
                class="info-value"
                id="dataCount">
                0
            </div>

        </div>


    </div>



    <!-- =================================================
         STATUS
    ================================================= -->

    <div
        id="status"
        class="status">

        Belum ada file Excel dipilih.

    </div>



    <!-- =================================================
         RESET
    ================================================= -->

    <button
        id="btnReset"
        class="btn btn-reset">

        RESET

    </button>



    <!-- =================================================
         PREVIEW
    ================================================= -->

    <div
        id="preview"
        class="preview"
        style="display:none;">

    </div>


</div>


</div>



<script>

/* =====================================================
   DATA GLOBAL
===================================================== */

let excelData = [];

let currentFile = null;



/* =====================================================
   ELEMENT
===================================================== */

const fileInput =
    document.getElementById(
        "fileInput"
    );


const status =
    document.getElementById(
        "status"
    );


const preview =
    document.getElementById(
        "preview"
    );


const fileName =
    document.getElementById(
        "fileName"
    );


const sheetName =
    document.getElementById(
        "sheetName"
    );


const dataCount =
    document.getElementById(
        "dataCount"
    );


const btnReset =
    document.getElementById(
        "btnReset"
    );



/* =====================================================
   HEADER DEFECT FLAT
===================================================== */

const REQUIRED_HEADERS = [

    "TGL FLAT",

    "ROLL ID",

    "KODE PROD",

    "JUMLAH (Pcs)",

    "JENIS DEFECT",

    "MESIN",

    "MOTIF",

    "BLOK + ISIAN",

    "GRUP",

    "OPERATOR"

];



/* =====================================================
   PILIH FILE
===================================================== */

fileInput.addEventListener(
    "change",
    function(){

        if(
            !this.files ||
            !this.files.length
        ){

            resetPage();

            return;

        }


        const file =
            this.files[0];


        const name =
            file.name.toLowerCase();


        if(
            !(
                name.endsWith(".xls") ||
                name.endsWith(".xlsx")
            )
        ){

            showError(
                "❌ File harus berformat XLS atau XLSX."
            );

            resetInfoOnly();

            return;

        }


        currentFile = file;


        fileName.textContent =
            file.name;


        status.className =
            "status";


        status.textContent =
            "⏳ Membaca file Excel...";


        preview.style.display =
            "none";


        const reader =
            new FileReader();


        reader.onload =
            function(event){

                try{

                    readExcel(
                        event.target.result
                    );

                }

                catch(error){

                    console.error(error);

                    showError(
                        "❌ Gagal membaca Excel: " +
                        error.message
                    );

                }

            };


        reader.onerror =
            function(){

                showError(
                    "❌ File tidak dapat dibaca."
                );

            };


        reader.readAsArrayBuffer(
            file
        );

    }
);



/* =====================================================
   BACA EXCEL
===================================================== */

function readExcel(buffer){

    const workbook =
        XLSX.read(
            buffer,
            {
                type:"array",
                cellDates:true
            }
        );


    if(
        !workbook.SheetNames.length
    ){

        throw new Error(
            "File Excel tidak memiliki sheet."
        );

    }


    const firstSheet =
        workbook.SheetNames[0];


    sheetName.textContent =
        firstSheet;


    const worksheet =
        workbook.Sheets[
            firstSheet
        ];


    const rows =
        XLSX.utils.sheet_to_json(
            worksheet,
            {
                header:1,
                defval:"",
                raw:false
            }
        );


    if(
        !rows.length
    ){

        throw new Error(
            "Sheet Excel kosong."
        );

    }


    excelData = rows;


    validateHeaders(
        rows
    );


    const dataRows =
        rows.slice(1).filter(
            function(row){

                return row.some(
                    function(value){

                        return String(
                            value
                        ).trim() !== "";

                    }
                );

            }
        );


    if(
        !dataRows.length
    ){

        throw new Error(
            "Tidak ditemukan data setelah header."
        );

    }


    dataCount.textContent =
        dataRows.length
        .toLocaleString(
            "id-ID"
        );


    renderPreview(
        rows
    );


    status.className =
        "status success";


    status.innerHTML =
        "✅ File berhasil dibaca.<br>" +
        "Sheet: <b>" +
        escapeHtml(firstSheet) +
        "</b><br>" +
        "Jumlah data: <b>" +
        dataRows.length.toLocaleString("id-ID") +
        "</b> baris.";

}



/* =====================================================
   VALIDASI HEADER
===================================================== */

function validateHeaders(rows){

    const headers =
        rows[0].map(
            function(value){

                return String(
                    value
                )
                .trim()
                .toUpperCase();

            }
        );


    if(
        headers.length < 10
    ){

        throw new Error(
            "Kolom Excel kurang dari 10 kolom."
        );

    }


    for(
        let i = 0;
        i < REQUIRED_HEADERS.length;
        i++
    ){

        const expected =
            REQUIRED_HEADERS[i]
            .toUpperCase();


        const actual =
            headers[i] || "";


        if(
            actual !== expected
        ){

            throw new Error(
                "Header kolom " +
                (i + 1) +
                " tidak sesuai. " +
                "Seharusnya: " +
                REQUIRED_HEADERS[i] +
                " | Terbaca: " +
                (actual || "(kosong)")
            );

        }

    }

}



/* =====================================================
   PREVIEW
===================================================== */

function renderPreview(rows){

    const maxRows =
        Math.min(
            rows.length,
            31
        );


    let html =
        "<table>";


    /* HEADER */

    html +=
        "<thead><tr>";


    for(
        let i = 0;
        i < 10;
        i++
    ){

        const value =
            rows[0][i] !== undefined
            ? rows[0][i]
            : "";


        html +=
            "<th>" +
            escapeHtml(value) +
            "</th>";

    }


    html +=
        "</tr></thead>";


    /* DATA */

    html +=
        "<tbody>";


    for(
        let r = 1;
        r < maxRows;
        r++
    ){

        html +=
            "<tr>";


        for(
            let c = 0;
            c < 10;
            c++
        ){

            const value =
                rows[r] &&
                rows[r][c] !== undefined
                ? rows[r][c]
                : "";


            html +=
                "<td>" +
                escapeHtml(
                    formatCell(value)
                ) +
                "</td>";

        }


        html +=
            "</tr>";

    }


    html +=
        "</tbody></table>";


    preview.innerHTML =
        html;


    preview.style.display =
        "block";


    if(
        rows.length > 31
    ){

        const warning =
            document.createElement(
                "div"
            );


        warning.className =
            "warning";


        warning.innerHTML =
            "ℹ️ Preview menampilkan " +
            "30 baris pertama. " +
            "Total data tetap " +
            (rows.length - 1)
            .toLocaleString("id-ID") +
            " baris.";


        preview.appendChild(
            warning
        );

    }

}



/* =====================================================
   FORMAT CELL
===================================================== */

function formatCell(value){

    if(
        value instanceof Date
    ){

        return value.toLocaleDateString(
            "id-ID"
        );

    }


    return value;

}



/* =====================================================
   RESET
===================================================== */

btnReset.addEventListener(
    "click",
    function(){

        resetPage();

    }
);



function resetPage(){

    fileInput.value = "";

    excelData = [];

    currentFile = null;


    fileName.textContent =
        "-";


    sheetName.textContent =
        "-";


    dataCount.textContent =
        "0";


    preview.innerHTML =
        "";


    preview.style.display =
        "none";


    status.className =
        "status";


    status.textContent =
        "Belum ada file Excel dipilih.";

}



function resetInfoOnly(){

    fileName.textContent =
        "-";

    sheetName.textContent =
        "-";

    dataCount.textContent =
        "0";

    preview.innerHTML =
        "";

    preview.style.display =
        "none";

}



/* =====================================================
   ERROR
===================================================== */

function showError(message){

    status.className =
        "status error";

    status.textContent =
        message;

}



/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

    return String(
        value == null
        ? ""
        : value
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}

</script>


</body>

</html>
