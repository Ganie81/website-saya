<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cek Roll ID</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      background: #f5f5f5;
    }

    .box {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,.15);
    }

    h2 {
      text-align: center;
    }

    input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      box-sizing: border-box;
      margin-bottom: 10px;
    }

    button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      cursor: pointer;
    }

    #hasil {
      margin-top: 20px;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>

<body>

<div class="box">

  <h2>CEK ROLL ID</h2>

  <input
    type="text"
    id="rollID"
    placeholder="Masukkan Roll ID"
  >

  <button onclick="cariRoll()">
    CARI
  </button>

  <div id="hasil"></div>

</div>

<script>

const URL_APPS_SCRIPT =
"https://script.google.com/macros/s/AKfycbwjUSxqgfHliPlsR0C2cfkcc9gMcRF-aTPBzUh-y7PaOioDLlyZ0bGaX7FX6evC6xsg/exec";


async function cariRoll() {

  const rollID =
    document.getElementById("rollID").value.trim();

  const hasil =
    document.getElementById("hasil");

  if (!rollID) {

    hasil.textContent =
      "Silakan masukkan Roll ID.";

    return;
  }

  hasil.textContent =
    "⏳ Mencari data...";

  try {

    const response =
      await fetch(
        URL_APPS_SCRIPT +
        "?rollID=" +
        encodeURIComponent(rollID)
      );

    const data =
      await response.json();

    hasil.textContent =
      JSON.stringify(data, null, 2);

  } catch (error) {

    hasil.textContent =
      "❌ Gagal terhubung ke server.\n\n" +
      error.message;

  }

}

</script>

</body>
</html>
