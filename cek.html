<body>

<div class="wrapper">


<!-- =================================================
     HEADER

<div class="header">

  <h1>

  </h1>

</div>


<!-- =================================================
     PENCARIAN
================================================== -->

<div class="search-panel">

  <label
    class="search-label"
    for="rollID"
  >
    NOMOR ROLL ID
  </label>

  <div class="search-row">

    <input
      type="text"
      id="rollID"
      placeholder="Masukkan Roll ID"
      autocomplete="off"
      spellcheck="false"
    >

    <button
      class="search-button"
      type="button"
      onclick="cariRoll()"
    >
      CARI
    </button>

  </div>

</div>


<!-- =================================================
     HASIL
================================================== -->

<div id="hasil"></div>


<div class="footer">

  SISTEM INFORMASI PROSES PRODUKSI

</div>

</div>


<script>

/* =====================================================
   URL APPS SCRIPT
===================================================== */

const URL_APPS_SCRIPT =
"https://script.google.com/macros/s/AKfycbxsJO62dtELPut4uBTJQJ2ZcIKXHqXGW9ITluy1TLul47fd97o1-v9yzJO4mH5WsXAn/exec";


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

  return String(value ?? "-")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   NILAI AMAN
===================================================== */

function nilai(value){

  if(
    value === null ||
    value === undefined ||
    value === ""
  ){

    return "-";

  }

  return value;

}


/* =====================================================
   CELL TABEL
===================================================== */

function cell(value){

  const v = nilai(value);

  return escapeHTML(v);

}


/* =====================================================
   BUAT TABEL PROSES
===================================================== */

function buatTabelProses(data){

  const flat =
    data.data?.FLAT || {};

  const steam =
    data.data?.STEAM || {};

  const curing =
    data.data?.CURING || {};

  const washing =
    data.data?.WASHING || {};


  /*
     FLAT memakai GRUB
     Proses lain memakai SHIFT
  */

  const flatGrup =
    flat["GRUB"] ||
    flat["GRUP"] ||
    "-";

  const steamShift =
    steam["SHIFT"] || "-";

  const curingShift =
    curing["SHIFT"] || "-";

  const washingShift =
    washing["SHIFT"] || "-";


  return `

    <div class="process-table-box">

      <div class="process-table-title">
        INFORMASI PROSES PRODUKSI
      </div>

      <div class="table-scroll">

        <table class="process-table">

          <thead>

            <tr>

              <th>URAIAN</th>

              <th>FLAT</th>

              <th>STEAM</th>

              <th>CURING</th>

              <th>WASHING</th>

            </tr>

          </thead>

          <tbody>

            <tr>

              <td>TANGGAL</td>

              <td>${cell(flat["TANGGAL"])}</td>

              <td>${cell(steam["TANGGAL"])}</td>

              <td>${cell(curing["TANGGAL"])}</td>

              <td>${cell(washing["TANGGAL"])}</td>

            </tr>

            <tr>

              <td>MESIN</td>

              <td>${cell(flat["MESIN"])}</td>

              <td>${cell(steam["MESIN"])}</td>

              <td>${cell(curing["MESIN"])}</td>

              <td>${cell(washing["MESIN"])}</td>

            </tr>

            <tr>

              <td>GRUP / SHIFT</td>

              <td>${cell(flatGrup)}</td>

              <td>${cell(steamShift)}</td>

              <td>${cell(curingShift)}</td>

              <td>${cell(washingShift)}</td>

            </tr>

            <tr>

              <td>NAMA</td>

              <td>${cell(flat["NAMA"])}</td>

              <td>${cell(steam["NAMA"])}</td>

              <td>${cell(curing["NAMA"])}</td>

              <td>${cell(washing["NAMA"])}</td>

            </tr>

          </tbody>

        </table>

      </div>

    </div>

  `;

}


/* =====================================================
   ROLL ID
===================================================== */

function buatRollInfo(data){

  return `

    <div class="roll-info-box">

      <div class="roll-title">
        NOMOR ROLL ID
      </div>

      <div class="roll-number">
        ${escapeHTML(data.rollID)}
      </div>

    </div>

  `;

}

/* =====================================================
   STATUS PERJALANAN
===================================================== */

function buatStatus(data){

  const status =
    data.status || {};


  const proses = [

    ["FLAT","FLAT"],

    ["STEAM","STEAM"],

    ["CURING","CURING"],

    ["WASHING","WASHING"]

  ];


  let html = `

    <div class="status-box">

      <div class="status-title">
        STATUS PERJALANAN ROLL
      </div>

      <div class="status-flow">

  `;


  proses.forEach(function(item){

    const nama =
      item[0];

    const key =
      item[1];

    const selesai =
      status[key] === "✓";


    html += `

      <div class="
        status-item
        ${selesai ? "done" : "pending"}
      ">

        <span class="status-name">
          ${nama}
        </span>

        <span class="status-icon">
          ${selesai ? "✓" : "-"}
        </span>

      </div>

    `;

  });


  html += `

      </div>

    </div>

  `;


  return html;

}


/* =====================================================
   TAMPILKAN HASIL
===================================================== */

function tampilkanHasil(data){

  const hasil =
    document.getElementById("hasil");


  if(
    !data ||
    !data.sukses
  ){

    hasil.innerHTML = `

      <div class="message">

        ❌
        ${escapeHTML(
          data?.pesan ||
          "Data tidak ditemukan."
        )}

      </div>

    `;

    return;

  }


  let html = "";


  /*
     URUTAN TAMPILAN
  */

  html +=
    buatTabelProses(data);


  html +=
    buatRollInfo(data);


  html +=
    buatDetailProduk(data);


  html +=
    buatStatus(data);


  hasil.innerHTML =
    html;

}


/* =====================================================
   CARI ROLL
===================================================== */

async function cariRoll(){

  const input =
    document.getElementById("rollID");

  const hasil =
    document.getElementById("hasil");

  const rollID =
    input.value.trim();


  if(!rollID){

    hasil.innerHTML = `

      <div class="message">

        ⚠️
        Silakan masukkan
        Roll ID terlebih dahulu.

      </div>

    `;

    input.focus();

    return;

  }


  hasil.innerHTML = `

    <div class="loading">

      ⏳ MENCARI DATA ROLL ID...

    </div>

  `;


  try{

    const response =
      await fetch(

        URL_APPS_SCRIPT +
        "?rollID=" +
        encodeURIComponent(rollID)

      );


    if(!response.ok){

      throw new Error(
        "Server mengembalikan status " +
        response.status
      );

    }


    const data =
      await response.json();


    tampilkanHasil(data);


  }catch(error){

    hasil.innerHTML = `

      <div class="message">

        ❌ GAGAL TERHUBUNG KE SERVER

        <br><br>

        ${escapeHTML(error.message)}

      </div>

    `;

  }

}


/* =====================================================
   ENTER = CARI
===================================================== */

document
  .getElementById("rollID")
  .addEventListener(
    "keydown",
    function(event){

      if(
        event.key === "Enter"
      ){

        event.preventDefault();

        cariRoll();

      }

    }
  );

</script>
