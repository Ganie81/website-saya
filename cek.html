/* =====================================================
   URL APPS SCRIPT
===================================================== */

const URL_APPS_SCRIPT =
"https://script.google.com/macros/s/AKfycbxsJO62dtELPut4uBTJQJ2ZcIKXHqXGW9ITluy1TLul47fd97o1-v9yzJO4mH5WsXAn/exec";


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

  return String(value ?? "-")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   STATUS
===================================================== */

function buatStatus(data){

  const status =
    data.status || {};

  const proses = [

    ["FLAT","FLAT"],

    ["STEAM","STEAM"],

    ["CURING","CURING"],

    ["WASHING","WASHING"]

  ];

  let html = `

    <div class="status-box">

      <div class="status-title">
        STATUS PERJALANAN ROLL
      </div>

      <div class="status-roll">
        ROLL ID :
        ${escapeHTML(data.rollID)}
      </div>

      <div class="status-flow">

  `;

  proses.forEach(function(item){

    const nama = item[0];

    const key = item[1];

    const selesai =
      status[key] === "✓";

    html += `

      <div class="
        status-item
        ${selesai ? "done" : "pending"}
      ">

        <span class="status-name">
          ${nama}
        </span>

        <span class="status-icon">
          ${selesai ? "✓" : "-"}
        </span>

      </div>

    `;

  });

  html += `

      </div>

    </div>

  `;

  return html;

}


/* =====================================================
   BARIS DATA
===================================================== */

function buatBaris(
  label,
  value,
  extraClass = ""
){

  const nilai =
    value === null ||
    value === undefined ||
    value === ""
      ? "-"
      : value;

  return `

    <div class="
      data-row
      ${extraClass}
    ">

      <div class="data-label">
        ${escapeHTML(label)}
      </div>

      <div class="data-value">
        ${escapeHTML(nilai)}
      </div>

    </div>

  `;

}


/* =====================================================
   KOTAK PROSES
===================================================== */

function buatProses(
  judul,
  data,
  daftar
){

  let isi = "";

  daftar.forEach(function(item){

    isi += buatBaris(
      item.label,
      data ? data[item.key] : "-",
      item.className || ""
    );

  });

  return `

    <div class="process-card">

      <div class="process-title">
        ${escapeHTML(judul)}
      </div>

      <div class="process-body">

        ${isi}

      </div>

    </div>

  `;

}


/* =====================================================
   TAMPILKAN HASIL
===================================================== */

function tampilkanHasil(data){

  const hasil =
    document.getElementById("hasil");

  if(
    !data ||
    !data.sukses
  ){

    hasil.innerHTML = `

      <div class="message">

        ❌
        ${escapeHTML(
          data?.pesan ||
          "Data tidak ditemukan."
        )}

      </div>

    `;

    return;

  }


  const flat =
    data.data?.FLAT;

  const steam =
    data.data?.STEAM;

  const curing =
    data.data?.CURING;

  const washing =
    data.data?.WASHING;


  let html = "";


  /* STATUS */

  html +=
    buatStatus(data);


  /* =================================================
     PRINTING
  ================================================== */

  html += buatProses(

    "PROSES PRINTING",

    flat,

    [

      {
        label:"ROLL ID",
        key:"ROLL ID"
      },

      {
        label:"TANGGAL",
        key:"TANGGAL"
      },

      {
        label:"MESIN",
        key:"MESIN"
      },

      {
        label:"MOTIF",
        key:"Motif Printing"
      },

      {
        label:"WARNA",
        key:"WARNA"
      },

      {
        label:"ISIAN WARNA",
        key:"ISIAN WARNA"
      },

      {
        label:"KODE PRODUK",
        key:"KODE PRODUK"
      },

      {
        label:"QTY",
        key:"QTY",
        className:"qty-row"
      },

      {
        label:"GRUP",
        key:"GRUB"
      },

      {
        label:"NAMA",
        key:"NAMA",
        className:"nama-row"
      }

    ]

  );


  /* =================================================
     STEAM
  ================================================== */

  html += buatProses(

    "PROSES STEAM",

    steam,

    [

      {
        label:"TANGGAL",
        key:"TANGGAL"
      },

      {
        label:"MESIN",
        key:"MESIN"
      },

      {
        label:"SHIFT",
        key:"SHIFT"
      },

      {
        label:"NAMA",
        key:"NAMA",
        className:"nama-row"
      }

    ]

  );


  /* =================================================
     CURING
  ================================================== */

  html += buatProses(

    "PROSES CURING",

    curing,

    [

      {
        label:"TANGGAL",
        key:"TANGGAL"
      },

      {
        label:"MESIN",
        key:"MESIN"
      },

      {
        label:"SHIFT",
        key:"SHIFT"
      },

      {
        label:"NAMA",
        key:"NAMA",
        className:"nama-row"
      }

    ]

  );


  /* =================================================
     WASHING
  ================================================== */

  html += buatProses(

    "PROSES WASHING",

    washing,

    [

      {
        label:"TANGGAL",
        key:"TANGGAL"

      {
        label:"MESIN",
        key:"MESIN"
      },

      {
        label:"SHIFT",
        key:"SHIFT"
      },

      {
        label:"NAMA",
        key:"NAMA",
        className:"nama-row"
      }

    ]

  );


  hasil.innerHTML =
    html;

}


/* =====================================================
   CARI ROLL
===================================================== */

async function cariRoll(){

  const input =
    document.getElementById("rollID");

  const hasil =
    document.getElementById("hasil");

  const rollID =
    input.value.trim();


  if(!rollID){

    hasil.innerHTML = `

      <div class="message">

        ⚠️
        Silakan masukkan
        Roll ID terlebih dahulu.

      </div>

    `;

    input.focus();

    return;

  }


  hasil.innerHTML = `

    <div class="loading">

      ⏳ MENCARI DATA ROLL ID...

    </div>

  `;


  try{

    const response =
      await fetch(

        URL_APPS_SCRIPT +
        "?rollID=" +
        encodeURIComponent(rollID)

      );


    if(!response.ok){

      throw new Error(
        "Server mengembalikan status " +
        response.status
      );

    }


    const data =
      await response.json();


    tampilkanHasil(data);


  }catch(error){

    hasil.innerHTML = `

      <div class="message">

        ❌ GAGAL TERHUBUNG KE SERVER

        <br><br>

        ${escapeHTML(error.message)}

      </div>

    `;

  }

}


/* =====================================================
   ENTER = CARI
===================================================== */

document
  .getElementById("rollID")
  .addEventListener(
    "keydown",
    function(event){

      if(
        event.key === "Enter"
      ){

        event.preventDefault();

        cariRoll();

      }

    }
  );
