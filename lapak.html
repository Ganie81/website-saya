<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LAPORAN PRODUKSI HARIAN</title>

<style>

/* =====================================================
   DASAR
===================================================== */

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:
        linear-gradient(
            135deg,
            #eef6fa 0%,
            #dcebf2 45%,
            #f7fafc 100%
        );
    color:#18384c;
    padding:12px;
}

/* =====================================================
   CONTAINER
===================================================== */

.container{
    width:100%;
    max-width:1100px;
    margin:auto;
}

/* =====================================================
   JUDUL
===================================================== */

.header{
    text-align:center;
    margin-bottom:12px;
}

.judul-3d{
    display:inline-block;
    margin:0;
    padding:8px 16px;

    font-size:27px;
    font-weight:900;
    letter-spacing:.5px;

    color:#214b67;

    text-shadow:
        1px 1px 0 #ffffff,
        2px 2px 0 #b6cbd7,
        3px 3px 5px rgba(30,65,85,.30);

    cursor:pointer;

    transition:
        transform .15s ease,
        text-shadow .15s ease;
}

.judul-3d:active{
    transform:translateY(3px);

    text-shadow:
        1px 1px 0 #ffffff,
        1px 1px 2px rgba(30,65,85,.25);
}

.subtitle{
    margin-top:1px;
    font-size:14px;
    font-weight:800;
    color:#47718b;
    letter-spacing:1px;
}

/* =====================================================
   FILTER
===================================================== */

.filter-panel{
    display:none;

    grid-template-columns:
        minmax(130px,1fr)
        minmax(130px,1fr);

    gap:9px;

    margin-bottom:13px;
    padding:11px;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #d9e8ef
        );

    border:1px solid #82a9bd;
    border-radius:13px;

    box-shadow:
        0 6px 12px rgba(39,77,98,.22),
        inset 0 2px 3px rgba(255,255,255,.95),
        inset 0 -3px 5px rgba(76,112,130,.18);
}

.filter-box{
    display:flex;
    flex-direction:column;
    gap:4px;
}

.filter-box label{
    font-size:12px;
    font-weight:900;
    color:#315c74;
}

.filter-box input,
.filter-box select{
    width:100%;
    min-height:38px;

    border:1px solid #7ca1b4;
    border-radius:9px;

    padding:7px 9px;

    background:#ffffff;
    color:#214b67;

    font-size:14px;
    font-weight:700;

    outline:none;

    box-shadow:
        inset 0 2px 4px rgba(0,0,0,.08),
        0 2px 3px rgba(40,75,95,.15);
}

.filter-box input:focus,
.filter-box select:focus{
    border-color:#315f7c;

    box-shadow:
        0 0 0 2px rgba(49,95,124,.12),
        inset 0 2px 4px rgba(0,0,0,.08);
}

/* =====================================================
   INFORMASI HARI / GRUP
===================================================== */

.info-bar{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;

    margin-bottom:13px;
}

.info-card{
    min-width:145px;
    padding:7px 13px;

    text-align:center;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #d9e9f1
        );

    border:1px solid #7fa7bb;
    border-radius:11px;

    box-shadow:
        0 5px 9px rgba(40,76,96,.22),
        inset 0 2px 3px rgba(255,255,255,.95),
        inset 0 -3px 5px rgba(62,102,124,.17);
}

.info-label{
    display:block;
    font-size:16px;
    font-weight:900;
    color:#4c7085;
}

.info-value{
    display:block;
    margin-top:1px;

    font-size:21px;
    font-weight:900;

    color:#214b67;

    text-shadow:
        1px 1px 0 #fff,
        2px 2px 3px rgba(30,65,85,.22);
}

/* =====================================================
   SECTION
===================================================== */

.section{
    margin-bottom:15px;

    border-radius:14px;
    overflow:hidden;

    background:#f9fcfd;

    border:1px solid #6f9ab2;

    box-shadow:
        0 7px 13px rgba(36,75,96,.25),
        inset 0 2px 3px rgba(255,255,255,.95),
        inset 0 -4px 7px rgba(45,83,103,.15);
}

.section-title{
    padding:8px 11px;

    text-align:center;

    font-size:17px;
    font-weight:900;

    color:#214b67;

    background:
        linear-gradient(
            145deg,
            #d9edf6,
            #9fc5d9
        );

    border-bottom:1px solid #7098ad;

    text-shadow:
        1px 1px 0 #ffffff,
        2px 2px 3px rgba(38,77,96,.25);

    box-shadow:
        inset 0 2px 3px rgba(255,255,255,.85),
        inset 0 -3px 5px rgba(53,91,111,.16);
}

/* =====================================================
   TABEL
===================================================== */

.table-wrap{
    width:100%;
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:separate;
    border-spacing:0;

    table-layout:fixed;
}

/* =====================================================
   HEADER TABEL
===================================================== */

thead th{
    padding:8px 5px;

    font-size:14px;
    font-weight:900;

    color:#ffffff;

    background:
        linear-gradient(
            145deg,
            #4f86a8,
            #285b7b
        );

    border-right:1px solid rgba(255,255,255,.28);
    border-bottom:2px solid #244f6a;

    text-align:center;

    text-shadow:
        1px 1px 2px rgba(0,0,0,.35);

    box-shadow:
        inset 0 2px 2px rgba(255,255,255,.25),
        inset 0 -3px 4px rgba(0,0,0,.18);
}

thead th:last-child{
    border-right:none;
}

/* =====================================================
   TABEL 1
===================================================== */

#tableFlat{
    background:#edf7fc;
}

#tableFlat tbody td{
    padding:8px 5px;

    font-size:17px;
    font-weight:800;

    color:#244a60;

    text-align:center;

    border-right:1px solid #c4d9e4;
    border-bottom:1px solid #c4d9e4;

    background:
        linear-gradient(
            145deg,
            #f9fdff,
            #e5f2f8
        );

    box-shadow:
        inset 0 1px 1px rgba(255,255,255,.85),
        inset 0 -2px 3px rgba(80,120,140,.08);
}

#tableFlat tbody td:last-child{
    border-right:none;
}

#tableFlat tbody tr:last-child td{
    border-bottom:none;
}

#tableFlat tbody tr{
    transition:transform .12s ease;
}

#tableFlat tbody tr:active{
    transform:scale(.995);
}

/* angka tabel 1 */

#tableFlat .angka{
    font-size:19px;
    font-weight:900;

    color:#173f56;

    text-shadow:
        1px 1px 0 #ffffff,
        1px 2px 2px rgba(30,65,85,.15);
}

#tableFlat .mc{
    font-size:18px;
    font-weight:900;
    color:#214b67;
}

#tableFlat .kode{
    font-size:17px;
    font-weight:900;
    word-break:break-word;
}

#tableFlat .acv{
    font-size:20px;
    font-weight:900;
    color:#214b67;
}

/* =====================================================
   TABEL 2
   LEBIH KECIL & PADAT
===================================================== */

#tableForm{
    background:#f4f4f4;
}

#tableForm thead th{
    padding:6px 3px;
    font-size:12px;
}

#tableForm tbody td{
    padding:5px 4px;

    font-size:16px;
    font-weight:800;

    color:#303d45;

    text-align:center;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #eeeeee
        );

    border-right:1px solid #d2d7da;
    border-bottom:1px solid #d2d7da;

    box-shadow:
        inset 0 1px 1px rgba(255,255,255,.95),
        inset 0 -2px 3px rgba(80,80,80,.07);
}

#tableForm tbody td:last-child{
    border-right:none;
}

#tableForm tbody tr:last-child td{
    border-bottom:none;
}

#tableForm .proses{
    font-size:15px;
    font-weight:900;
}

#tableForm .kode{
    font-size:15px;
    font-weight:900;
    word-break:break-word;
}

#tableForm .qty{
    font-size:17px;
    font-weight:900;
}

#tableForm .satuan{
    font-size:14px;
    font-weight:900;
}

/* =====================================================
   LOADING
===================================================== */

.loading{
    display:none;

    margin:10px 0;
    padding:8px;

    text-align:center;

    font-size:13px;
    font-weight:800;

    color:#315c74;

    background:#e4f0f6;

    border:1px solid #9ab8c8;
    border-radius:9px;

    box-shadow:
        inset 0 2px 3px rgba(255,255,255,.8),
        inset 0 -2px 3px rgba(70,100,115,.10);
}

/* =====================================================
   KOSONG
===================================================== */

.empty{
    padding:15px 8px;

    text-align:center;

    font-size:14px;
    font-weight:800;

    color:#6d7d86;

    background:#f5f8fa;
}

/* =====================================================
   FOOTER
===================================================== */

.footer{
    margin-top:10px;

    text-align:center;

    font-size:10px;
    font-weight:700;

    color:#718795;
}

/* =====================================================
   RESPONSIVE HP
===================================================== */

@media(max-width:600px){

    body{
        padding:7px;
    }

    .judul-3d{
        font-size:22px;
        padding:6px 9px;
    }

    .subtitle{
        font-size:11px;
    }

    .filter-panel{
        grid-template-columns:1fr 1fr;
        gap:6px;
        padding:8px;
    }

    .filter-box label{
        font-size:10px;
    }

    .filter-box input,
    .filter-box select{
        min-height:34px;
        padding:5px 7px;
        font-size:12px;
    }

    .info-bar{
        gap:6px;
        margin-bottom:9px;
    }

    .info-card{
        min-width:125px;
        padding:5px 8px;
    }

    .info-label{
        font-size:13px;
    }

    .info-value{
        font-size:18px;
    }

    .section{
        margin-bottom:10px;
        border-radius:10px;
    }

    .section-title{
        padding:6px 7px;
        font-size:14px;
    }

    /* TABEL 1 HP */

    #tableFlat thead th{
        padding:6px 2px;
        font-size:11px;
    }

    #tableFlat tbody td{
        padding:6px 2px;
        font-size:14px;
    }

    #tableFlat .angka{
        font-size:15px;
    }

    #tableFlat .mc{
        font-size:15px;
    }

    #tableFlat .kode{
        font-size:14px;
    }

    #tableFlat .acv{
        font-size:16px;
    }

    /* TABEL 2 HP */

    #tableForm thead th{
        padding:5px 2px;
        font-size:10px;
    }

    #tableForm tbody td{
        padding:4px 2px;
        font-size:14px;
    }

    #tableForm .proses{
        font-size:13px;
    }

    #tableForm .kode{
        font-size:13px;
    }

    #tableForm .qty{
        font-size:14px;
    }

    #tableForm .satuan{
        font-size:12px;
    }

    .footer{
        font-size:9px;
    }
}

/* =====================================================
   LAYAR SANGAT KECIL
===================================================== */

@media(max-width:380px){

    .judul-3d{
        font-size:19px;
    }

    .subtitle{
        font-size:10px;
    }

    #tableFlat thead th{
        font-size:10px;
    }

    #tableFlat tbody td{
        padding:5px 1px;
        font-size:13px;
    }

    #tableFlat .angka{
        font-size:14px;
    }

    #tableFlat .kode{
        font-size:12px;
    }

    #tableFlat .acv{
        font-size:15px;
    }

    #tableForm thead th{
        font-size:9px;
    }

    #tableForm tbody td{
        padding:3px 1px;
        font-size:12px;
    }

    #tableForm .proses,
    #tableForm .kode{
        font-size:11px;
    }

    #tableForm .qty{
        font-size:13px;
    }

    #tableForm .satuan{
        font-size:11px;
    }
}

</style>
</head>

<body>

<div class="container">

    <!-- =================================================

    <div class="header">

        >

        </h1>

    <!-- =================================================

    ================================================== -->

    <div

        <div class="filter-box">

            <label for="tanggal">

        <div class="filter-box">

                id="grup"
                onchange="ambilData()"
            >

                <option value="">
                    SEMUA GRUP
                </option>

                <option value="A">

    <!-- =================================================

            <span
                id="infoTanggal"
                class="info-value"
            >

            </span>

        </div>


        <div class="info-card">

            <span
                id="infoGrup"

    <!-- =================================================
         TABEL 1
    ================================================== -->

    <section class="section">

        <div class="section-title">
            PRODUKSI FLATBED PRINT
        </div>

        <div class="table-wrap">

            <table id="tableFlat">

                <colgroup>
                    <col style="width:12%">
                    <col style="width:28%">
                    <col style="width:17%">

                </colgroup>

                <thead>

                    <tr>

                        <th>MC</th>

                        <th>KODE PRODUK</th>

                        <th>QTY (Pcs)</th>

                        <th>KD</th>

                        <th>TARGET (KD)</th>

            <table id="tableForm">

                <colgroup>
                    <col style="width:25%">
                    <col style="width:39%">
                    <col style="width:18%">
                    <col style="width:18%">
                </colgroup>

                <thead>

                    <tr>

                        <th>PROSES</th>

                        <th>KODE PRODUK</th>

                        <th>QTY</th>

                        <th>SATUAN</th>

                    </tr>

                </thead>

                    <tr>
                        <td
                            colspan="4"
                            class="empty"

                            Memuat data...

    <div class="footer">
        LAPORAN PRODUKSI HARIAN • DEPARTEMEN PRINTING

<script>

/* =====================================================
   KONFIGURASI
===================================================== */

const WEB_APP_URL =
"https://script.google.com/macros/s/AKfycbwzhYbVJLh8X6yOveOsz1mpXVoOrGTXXOzPM-zpo6_sh31tTeeM5YFT1B2SZ2xTfAdt/exec";


/* =====================================================
   TARGET MC
===================================================== */

const TARGET_MC = {

    "FLAT 1":100,
    "FLAT 2":100,
    "FLAT 4":100,
    "FLAT 5":133,
    "FLAT 6":133,
    "FLAT 7":133

};


/* =====================================================
   ELEMENT
===================================================== */

const filterPanel =
    document.getElementById("filterPanel");

const tanggalInput =
    document.getElementById("tanggal");

const grupInput =
    document.getElementById("grup");

const loading =
    document.getElementById("loading");

const flatBody =
    document.getElementById("flatBody");

const formBody =
    document.getElementById("formBody");

const infoTanggal =
    document.getElementById("infoTanggal");

const infoGrup =
    document.getElementById("infoGrup");


/* =====================================================
   FILTER TOGGLE
===================================================== */

let filterTerbuka = false;

function toggleFilter(){

    filterTerbuka =
        !filterTerbuka;

    filterPanel.style.display =
        filterTerbuka
            ? "grid"
            : "none";

}


/* =====================================================
   FORMAT ANGKA
===================================================== */

function angka(value){

    const n =
        Number(
            String(value ?? "")
            .replace(/,/g,"")
            .replace(/\./g,"")
        );

    if(
        isNaN(n)
    ){
        return "0";
    }

    return n.toLocaleString(
        "id-ID"
    );

}


/* =====================================================
   NORMALISASI TEKS
===================================================== */

function teks(value){

    return String(
        value ?? ""
    ).trim();

}


/* =====================================================
   NORMALISASI MC
===================================================== */

function normalMC(value){

    return teks(value)
        .toUpperCase()
        .replace(/\s+/g," ");

}


/* =====================================================
   NORMALISASI KODE
===================================================== */

function normalKode(value){

    return teks(value)
        .toUpperCase()
        .replace(/\s+/g," ");

}


/* =====================================================
   NORMALISASI TANGGAL
===================================================== */

function normalTanggal(value){

    if(!value){
        return "";
    }

    let s =
        String(value).trim();

    /*
       Jika format sudah YYYY-MM-DD
    */

    if(
        /^\d{4}-\d{2}-\d{2}$/.test(s)
    ){
        return s;
    }

    /*
       Jika ISO datetime
    */

    if(
        /^\d{4}-\d{2}-\d{2}T/.test(s)
    ){
        return s.substring(
            0,
            10
        );
    }

    /*
       Format tanggal Indonesia
       DD/MM/YYYY
    */

    const m =
        s.match(
            /^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/
        );

    if(m){

        return (
            m[3] +
            "-" +
            m[2].padStart(2,"0") +
            "-" +
            m[1].padStart(2,"0")
        );

    }

    /*
       Coba Date
    */

    const d =
        new Date(s);

    if(
        !isNaN(d.getTime())
    ){

        const y =
            d.getFullYear();

        const mo =
            String(
                d.getMonth()+1
            ).padStart(2,"0");

        const day =
            String(
                d.getDate()
            ).padStart(2,"0");

        return (
            y +
            "-" +
            mo +
            "-" +
            day
        );

    }

    return s;

}


/* =====================================================
   AMBIL FIELD DATA FLAT
===================================================== */

function getFlatField(
    row,
    field
){

    if(
        row &&
        typeof row === "object" &&
        !Array.isArray(row)
    ){

        const keys =
            Object.keys(row);

        const target =
            field.toLowerCase();

        for(
            const key of keys
        ){

            if(
                key
                .toLowerCase()
                .trim()
                === target
            ){

                return row[key];

            }

        }

    }

    return "";

}


/* =====================================================
   AMBIL DATA FLAT DENGAN BEBERAPA ALTERNATIF
===================================================== */

function ambilMC(row){

    return (
        getFlatField(row,"MC") ||
        getFlatField(row,"Mesin") ||
        getFlatField(row,"MESIN")
    );

}


function ambilKode(row){

    return (
        getFlatField(row,"KODE PRODUK") ||
        getFlatField(row,"KODE_PRODUK") ||
        getFlatField(row,"Kode Produk")
    );

}


function ambilQty(row){

    return (
        getFlatField(row,"QTY") ||
        getFlatField(row,"QTY (PCS)") ||
        getFlatField(row,"QTY PCS") ||
        getFlatField(row,"QTY (Pcs)")
    );

}


function ambilKD(row){

    return (
        getFlatField(row,"KD") ||
        getFlatField(row,"Kodi")
    );

}


function ambilTanggal(row){

    return (
        getFlatField(row,"TANGGAL") ||
        getFlatField(row,"Tanggal") ||
        getFlatField(row,"DATE")
    );

}


function ambilGrup(row){

    return (
        getFlatField(row,"GRUP") ||
        getFlatField(row,"Grup") ||
        getFlatField(row,"GROUP")
    );

}


/* =====================================================
   ANGKA DARI DATA
===================================================== */

function angkaData(value){

    if(
        typeof value === "number"
    ){
        return value;
    }

    let s =
        String(value ?? "")
        .trim();

    if(!s){
        return 0;
    }

    /*
       Hilangkan teks satuan
    */

    s =
        s.replace(
            /pcs|pc|kd|kodi/gi,
            ""
        )
        .trim();

    /*
       Format Indonesia:
       1.234,56
    */

    if(
        s.includes(",") &&
        s.includes(".")
    ){

        s =
            s.replace(/\./g,"")
             .replace(",",".");
    }

    else if(
        s.includes(",")
    ){

        s =
            s.replace(",",".");
    }

    else if(
        s.includes(".")
    ){

        /*
           Bilangan bulat dengan titik
           biasanya pemisah ribuan.
        */

        const bagian =
            s.split(".");

        if(
            bagian.length > 2
        ){

            s =
                s.replace(/\./g,"");

        }
        else if(
            bagian.length === 2 &&
            bagian[1].length === 3
        ){

            s =
                s.replace(/\./g,"");

        }

    }

    const n =
        Number(s);

    return isNaN(n)
        ? 0
        : n;

}


/* =====================================================
   SET TANGGAL DEFAULT
===================================================== */

function setTanggalHariIni(){

    const d =
        new Date();

    const y =
        d.getFullYear();

    const m =
        String(
            d.getMonth()+1
        ).padStart(2,"0");

    const day =
        String(
            d.getDate()
        ).padStart(2,"0");

    tanggalInput.value =
        y +
        "-" +
        m +
        "-" +
        day;

}


/* =====================================================
   FORMAT TANGGAL TAMPILAN
===================================================== */

function formatTanggalIndo(
    value
){

    if(!value){
        return "-";
    }

    const parts =
        value.split("-");

    if(
        parts.length !== 3
    ){
        return value;
    }

    const bulan = [
        "JAN",
        "FEB",
        "MAR",
        "APR",
        "MEI",
        "JUN",
        "JUL",
        "AGU",
        "SEP",
        "OKT",
        "NOV",
        "DES"
    ];

    return (
        parts[2] +
        " " +
        bulan[
            Number(parts[1])-1
        ] +
        " " +
        parts[0]
    );

}


/* =====================================================
   UPDATE INFORMASI
===================================================== */

function updateInfo(){

    infoTanggal.textContent =
        formatTanggalIndo(
            tanggalInput.value
        );

    const g =
        teks(
            grupInput.value
        );

    infoGrup.textContent =
        g
            ? "GRUP " + g
            : "SEMUA";

}


/* =====================================================
   FETCH DATA
===================================================== */

async function ambilData(){

    const tanggal =
        tanggalInput.value;

    const grup =
        grupInput.value;

    updateInfo();

    loading.style.display =
        "block";

    loading.textContent =
        "⏳ Mengambil data...";

    flatBody.innerHTML =
        `
        <tr>
            <td colspan="6"
                class="empty">
                Mengambil data...
            </td>
        </tr>
        `;

    formBody.innerHTML =
        `
        <tr>
            <td colspan="4"
                class="empty">
                Mengambil data...
            </td>
        </tr>
        `;

    try{

        const urlFlat =
            WEB_APP_URL +
            "?action=flat";

        const urlForm =
            WEB_APP_URL +
            "?action=form";

        /*
           Ambil dua sumber bersamaan
           supaya lebih cepat.
        */

        const [
            responseFlat,
            responseForm
        ] =
            await Promise.all([

                fetch(urlFlat),

                fetch(urlForm)

            ]);


        if(
            !responseFlat.ok
        ){
            throw new Error(
                "Gagal mengambil data FLAT"
            );
        }

        if(
            !responseForm.ok
        ){
            throw new Error(
                "Gagal mengambil data FORM"
            );
        }


        const [
            flatData,
            formData
        ] =
            await Promise.all([

                responseFlat.json(),

                responseForm.json()

            ]);


        tampilkanFlat(
            flatData,
            tanggal,
            grup
        );


        tampilkanForm(
            formData,
            tanggal,
            grup
        );


        loading.style.display =
            "none";

    }
    catch(error){

        console.error(error);

        loading.textContent =
            "❌ Gagal mengambil data";

        flatBody.innerHTML =
            `
            <tr>
                <td colspan="6"
                    class="empty">
                    Data FLAT gagal dimuat
                </td>
            </tr>
            `;

        formBody.innerHTML =
            `
            <tr>
                <td colspan="4"
                    class="empty">
                    Data FORM gagal dimuat
                </td>
            </tr>
            `;

    }

}


/* =====================================================
   TABEL 1
   KUMULATIF PER MC
   TAPI KODE PRODUK TETAP BERBEDA
===================================================== */

function tampilkanFlat(
    data,
    tanggalDipilih,
    grupDipilih
){

    /*
       Antisipasi jika Apps Script
       mengembalikan object pembungkus.
    */

    let rows =
        Array.isArray(data)
            ? data
            : (
                Array.isArray(data?.data)
                    ? data.data
                    : []
            );


    /*
       FILTER TANGGAL + GRUP
    */

    rows =
        rows.filter(
            row => {

                const t =
                    normalTanggal(
                        ambilTanggal(row)
                    );

                const g =
                    teks(
                        ambilGrup(row)
                    ).toUpperCase();

                const cocokTanggal =
                    !tanggalDipilih ||
                    t === tanggalDipilih;

                const cocokGrup =
                    !grupDipilih ||
                    g ===
                    grupDipilih.toUpperCase();

                return (
                    cocokTanggal &&
                    cocokGrup
                );

            }
        );


    /*
       Struktur:

       MC
          KODE 1
             QTY
             KD
          KODE 2
             QTY
             KD

       Kemudian total KD seluruh
       kode dihitung untuk ACV.
    */

    const mesinMap = {};


    rows.forEach(
        row => {

            const mc =
                normalMC(
                    ambilMC(row)
                );

            const kode =
                normalKode(
                    ambilKode(row)
                );

            if(!mc){
                return;
            }


            if(
                !mesinMap[mc]
            ){

                mesinMap[mc] = {

                    kodeMap:{},

                    totalQty:0,

                    totalKD:0

                };

            }


            /*
               Kalau kode kosong,
               tetap diberi label -
            */

            const kodeKey =
                kode || "-";


            if(
                !mesinMap[mc]
                    .kodeMap[kodeKey]
            ){

                mesinMap[mc]
                    .kodeMap[kodeKey] = {

                        kode:kodeKey,

                        qty:0,

                        kd:0

                    };

            }


            const qty =
                angkaData(
                    ambilQty(row)
                );

            const kd =
                angkaData(
                    ambilKD(row)
                );


            /*
               Jumlahkan per KODE PRODUK
            */

            mesinMap[mc]
                .kodeMap[kodeKey]
                .qty += qty;

            mesinMap[mc]
                .kodeMap[kodeKey]
                .kd += kd;


            /*
               Total mesin untuk ACV
            */

            mesinMap[mc]
                .totalQty += qty;

            mesinMap[mc]
                .totalKD += kd;

        }
    );


    const mesinList =
        Object.keys(
            mesinMap
        ).sort(
            (a,b) => {

                const na =
                    parseInt(
                        a.replace(/\D/g,"")
                    ) || 999;

                const nb =
                    parseInt(
                        b.replace(/\D/g,"")
                    ) || 999;

                return na - nb;

            }
        );


    if(
        mesinList.length === 0
    ){

        flatBody.innerHTML =
            `
            <tr>
                <td colspan="6"
                    class="empty">
                    Tidak ada data FLAT
                </td>
            </tr>
            `;

        return;

    }


    let html = "";


    mesinList.forEach(
        mc => {

            const mesin =
                mesinMap[mc];

            const kodeList =
                Object.values(
                    mesin.kodeMap
                );


            /*
               Satu MC bisa memiliki
               beberapa kode berbeda.

               Satu baris untuk setiap
               kode berbeda.
            */

            const jumlahKode =
                kodeList.length;


            const target =
                Number(
                    TARGET_MC[mc] || 0
                );


            const acv =
                target > 0
                    ? (
                        mesin.totalKD /
                        target *
                        100
                    )
                    : 0;


            kodeList.forEach(
                (item,index) => {

                    /*
                       Target & ACV hanya
                       ditampilkan pada
                       baris pertama MC.
                    */

                    const tampilTarget =
                        index === 0
                            ? angka(target) + " KD"
                            : "";

                    const tampilACV =
                        index === 0
                            ? acv.toFixed(1) + "%"
                            : "";


                    const tampilMC =
                        index === 0
                            ? mc
                            : "";


                    html +=
                        `
                        <tr>

                            <td class="mc">
                                ${escapeHtml(
                                    tampilMC
                                )}
                            </td>

                            <td class="kode">
                                ${escapeHtml(
                                    item.kode
                                )}
                            </td>

                            <td class="angka">
                                ${angka(
                                    item.qty
                                )}
                                <small>Pcs</small>
                            </td>

                            <td class="angka">
                                ${angka(
                                    item.kd
                                )}
                                <small>KD</small>
                            </td>

                            <td class="angka">
                                ${tampilTarget}
                            </td>

                            <td class="acv">
                                ${tampilACV}
                            </td>

                        </tr>
                        `;

                }
            );

        }
    );


    flatBody.innerHTML =
        html;

}


/* =====================================================
   TABEL 2
===================================================== */

function tampilkanForm(
    data,
    tanggalDipilih,
    grupDipilih
){

    let rows =
        Array.isArray(data)
            ? data
            : (
                Array.isArray(data?.data)
                    ? data.data
                    : []
            );


    /*
       FILTER TANGGAL + GRUP
    */

    rows =
        rows.filter(
            row => {

                const tanggal =
                    normalTanggal(
                        getFormField(
                            row,
                            "TANGGAL"
                        )
                    );

                const grup =
                    teks(
                        getFormField(
                            row,
                            "GRUP"
                        )
                    ).toUpperCase();


                const cocokTanggal =
                    !tanggalDipilih ||
                    tanggal === tanggalDipilih;

                const cocokGrup =
                    !grupDipilih ||
                    grup ===
                    grupDipilih.toUpperCase();


                return (
                    cocokTanggal &&
                    cocokGrup
                );

            }
        );


    if(
        rows.length === 0
    ){

        formBody.innerHTML =
            `
            <tr>
                <td colspan="4"
                    class="empty">
                    Tidak ada data proses
                </td>
            </tr>
            `;

        return;

    }


    let html = "";


    rows.forEach(
        row => {

            const proses =
                getFormField(
                    row,
                    "PROSES"
                );

            const kode =
                getFormField(
                    row,
                    "KODE PRODUK"
                );

            const qty =
                getFormField(
                    row,
                    "QTY"
                );

            const satuan =
                getFormField(
                    row,
                    "SATUAN"
                );


            html +=
                `
                <tr>

                    <td class="proses">
                        ${escapeHtml(
                            teks(proses)
                        )}
                    </td>

                    <td class="kode">
                        ${escapeHtml(
                            teks(kode)
                        )}
                    </td>

                    <td class="qty">
                        ${escapeHtml(
                            teks(qty)
                        )}
                    </td>

                    <td class="satuan">
                        ${escapeHtml(
                            teks(satuan)
                        )}
                    </td>

                </tr>
                `;

        }
    );


    formBody.innerHTML =
        html;

}


/* =====================================================
   FIELD FORM
===================================================== */

function getFormField(
    row,
    field
){

    if(
        row &&
        typeof row === "object" &&
        !Array.isArray(row)
    ){

        const keys =
            Object.keys(row);

        const target =
            field
                .toLowerCase()
                .trim();


        for(
            const key of keys
        ){

            if(
                key
                    .toLowerCase()
                    .trim()
                    === target
            ){

                return row[key];

            }

        }

    }

    return "";

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   MULAI
===================================================== */

setTanggalHariIni();

updateInfo();

ambilData();

</script>
