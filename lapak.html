/* =====================================================
   URL APPS SCRIPT
===================================================== */

const WEB_APP_URL =
"https://script.google.com/macros/s/AKfycbwzhYbVJLh8X6yOveOsz1mpXVoOrGTXXOzPM-zpo6_sh31tTeeM5YFT1B2SZ2xTfAdt/exec";


/* =====================================================
   TARGET PER MESIN
===================================================== */

const TARGET_MC = {

    "FLAT 1":100,

    "FLAT 2":100,

    "FLAT 4":100,

    "FLAT 5":133,

    "FLAT 6":133,

    "FLAT 7":133

};


/* =====================================================
   ELEMENT
===================================================== */

    document.getElementById(
        "tanggal"
    );


const grupInput =
    document.getElementById(
        "grup"
    );


const loading =
    document.getElementById(
        "loading"
    );


const flatBody =
    document.getElementById(
        "flatBody"
    );


const formBody =
    document.getElementById(
        "formBody"
    );


const filterPanel =
    document.getElementById(
        "filterPanel"
    );


/* =====================================================
   FILTER BUKA / TUTUP
   FILTER SELALU TERTUTUP SAAT AWAL
===================================================== */

let filterTerbuka =
    false;


function kunciFilter(){

    filterTerbuka =
        false;

    filterPanel.style.display =
        "none";

}


function toggleFilter(){

    filterTerbuka =
        !filterTerbuka;

    filterPanel.style.display =
        filterTerbuka
        ? "grid"
        : "none";

}


/* =====================================================
   TANGGAL HARI INI
===================================================== */

function tanggalHariIni(){

    const sekarang =
        new Date();

    const tahun =
        sekarang.getFullYear();

    const bulan =
        String(
            sekarang.getMonth() + 1
        ).padStart(
            2,
            "0"
        );

    const hari =
        String(
            sekarang.getDate()
        ).padStart(
            2,
            "0"
        );

    return (
        tahun +
        "-" +
        bulan +
        "-" +
        hari
    );

}


/* =====================================================
   FORMAT TANGGAL INDONESIA
===================================================== */

function formatTanggalIndonesia(
    tanggal
){

    if(!tanggal){

        return "-";

    }


    const bagian =
        tanggal.split("-");


    if(
        bagian.length !== 3
    ){

        return tanggal;

    }


    const namaBulan = [

        "JANUARI",
        "FEBRUARI",
        "MARET",
        "APRIL",
        "MEI",
        "JUNI",
        "JULI",
        "AGUSTUS",
        "SEPTEMBER",
        "OKTOBER",
        "NOVEMBER",
        "DESEMBER"

    ];


    return (

        bagian[2] +
        " " +
        namaBulan[
            Number(
                bagian[1]
            ) - 1
        ] +
        " " +
        bagian[0]

    );

}


/* =====================================================
   UPDATE INFO
===================================================== */

function updateInfo(){

    const tanggal =
        tanggalInput.value;


    const grup =
        grupInput.value;


    document.getElementById(
        "infoTanggal"
    ).textContent =
        formatTanggalIndonesia(
            tanggal
        );


    document.getElementById(
        "infoGrup"
    ).textContent =
        grup
        ? "GRUP " + grup
        : "SEMUA";

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
    value
){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   FORMAT ANGKA
===================================================== */

function formatAngka(
    angka
){

    const number =
        Number(angka) || 0;

    return number.toLocaleString(
        "id-ID"
    );

}


/* =====================================================
   AMBIL TARGET MC
===================================================== */

function ambilTargetMC(
    mc
){

    if(!mc){

        return 0;

    }


    const nama =
        String(mc)
        .trim()
        .toUpperCase();


    if(
        TARGET_MC[nama] !== undefined
    ){

        return TARGET_MC[nama];

    }


    const angkaMC =
        nama.match(
            /\d+/
        );


    if(angkaMC){

        const key =
            "FLAT " +
            angkaMC[0];


        if(
            TARGET_MC[key] !== undefined
        ){

            return TARGET_MC[key];

        }

    }


    return 0;

}


/* =====================================================
   HITUNG ACV
===================================================== */

function hitungACV(
    kd,
    target
){

    const nilaiKD =
        Number(kd) || 0;


    const nilaiTarget =
        Number(target) || 0;


    if(
        nilaiTarget <= 0
    ){

        return 0;

    }


    return (
        nilaiKD /
        nilaiTarget *
        100
    );

}

   AMBIL DATA
===================================================== */

    /*
       FILTER TIDAK DIKUNCI LAGI.
       PANEL FILTER TETAP TERBUKA
       SAAT DATA DIPERBARUI.
    */


    const tanggal =

    formBody.innerHTML =
        `
        <tr>

            <td
                colspan="4"
                class="empty"
            >
                ⏳ Memuat data...
            </td>

        </tr>
        `;


    try{


        /* =============================================
           FLAT
        ============================================= */

        let urlFlat =
            WEB_APP_URL +
            "?action=flat";


        if(tanggal){

            urlFlat +=
                "&tanggal=" +
                encodeURIComponent(
                    tanggal
                );

        }


        if(grup){

            urlFlat +=
                "&grup=" +
                encodeURIComponent(
                    grup
                );

        }


        const responseFlat =
            await fetch(
                urlFlat,
                {
                    cache:"no-store"
                }
            );


        if(
            !responseFlat.ok
        ){

            throw new Error(
                "Gagal mengambil data FLAT"
            );

        }


        const hasilFlat =
            await responseFlat.json();


        if(
            !hasilFlat.sukses
        ){

            throw new Error(
                hasilFlat.pesan ||
                "Data FLAT gagal"
            );

        }


        tampilkanFlat(
            hasilFlat.data || []
        );


        /* =============================================
           FORM RESPONSES 5
        ============================================= */

        let urlForm =
            WEB_APP_URL +
            "?action=form";


        if(tanggal){

            urlForm +=
                "&tanggal=" +
                encodeURIComponent(
                    tanggal
                );

        }


        if(grup){

            urlForm +=
                "&grup=" +
                encodeURIComponent(
                    grup
                );

        }


        const responseForm =
            await fetch(
                urlForm,
                {
                    cache:"no-store"
                }
            );


        if(
            !responseForm.ok
        ){

            throw new Error(
                "Gagal mengambil data FORM"
            );

        }


        const hasilForm =
            await responseForm.json();


        if(
            !hasilForm.sukses
        ){

            throw new Error(
                hasilForm.pesan ||
                "Data FORM gagal"
            );

        }


        tampilkanForm(
            hasilForm.data || []
        );


        loading.style.display =
            "none";


    }catch(error){

        console.error(
            error
        );


        loading.textContent =
            "❌ " +
            error.message;


        flatBody.innerHTML =
            `
            <tr>

                <td
                    colspan="6"
                    class="empty"
                >
                    ❌ Gagal mengambil data
                </td>

            </tr>
            `;


        formBody.innerHTML =
            `
            <tr>

                <td
                    colspan="4"
                    class="empty"
                >
                    ❌ Gagal mengambil data
                </td>

            </tr>
            `;

    }

}


/* =====================================================
   TABEL 1
   KODE PRODUK DIJUMLAHKAN PER KODE
   ACV DIHITUNG KUMULATIF PER MESIN
===================================================== */

function tampilkanFlat(
    data
){

    flatBody.innerHTML =
        "";


    if(
        !data ||
        data.length === 0
    ){

        flatBody.innerHTML =
            `
            <tr>

                <td
                    colspan="6"
                    class="empty"
                >
                    Tidak ada produksi FLAT
                    pada hari/grup ini
                </td>

            </tr>
            `;

        return;

    }


    /* =============================================
       GABUNGKAN BERDASARKAN MC + KODE PRODUK
    ============================================= */

    const kelompok = {};


    data.forEach(
        function(row){

            const mc =
                String(
                    row.mc || "-"
                )
                .trim()
                .toUpperCase();


            const kodeProduk =
                String(
                    row.kodeProduk ||
                    row.kode ||
                    "-"
                )
                .trim()
                .toUpperCase();


            const key =
                mc +
                "||" +
                kodeProduk;


            if(
                !kelompok[key]
            ){

                kelompok[key] = {

                    mc:mc,

                    kodeProduk:
                        kodeProduk,

                    qty:0,

                    kd:0

                };

            }


            kelompok[key].qty +=
                Number(row.qty) || 0;


            kelompok[key].kd +=
                Number(row.kd) || 0;

        }
    );


    const hasil =
        Object.values(
            kelompok
        );


    /* =============================================
       TOTAL KUMULATIF PER MESIN
    ============================================= */

    const totalMesin = {};


    hasil.forEach(
        function(row){

            if(
                !totalMesin[row.mc]
            ){

                totalMesin[row.mc] = {

                    kd:0

                };

            }


            totalMesin[row.mc].kd +=
                Number(row.kd) || 0;

        }
    );


    /* =============================================
       URUTKAN
       MC → KODE PRODUK
    ============================================= */

    hasil.sort(
        function(a,b){

            const urutMC =
                String(a.mc)
                .localeCompare(
                    String(b.mc),
                    undefined,
                    {
                        numeric:true
                    }
                );


            if(
                urutMC !== 0
            ){

                return urutMC;

            }


            return String(
                a.kodeProduk
            ).localeCompare(
                String(b.kodeProduk),
                undefined,
                {
                    numeric:true
                }
            );

        }
    );


    /* =============================================
       HITUNG TOTAL SELURUH TABEL
    ============================================= */

    let totalQty =
        0;

    let totalKD =
        0;


    hasil.forEach(
        function(row){

            totalQty +=
                Number(row.qty) || 0;

            totalKD +=
                Number(row.kd) || 0;

        }
    );


    /* =============================================
       TAMPILKAN
       TARGET & ACV HANYA 1x PER MESIN
    ============================================= */

    hasil.forEach(
        function(row,index){

            const tr =
                document.createElement(
                    "tr"
                );


            const mc =
                row.mc || "-";


            const target =
                ambilTargetMC(
                    mc
                );


            const totalKDmesin =
                totalMesin[mc]
                ? totalMesin[mc].kd
                : 0;


            const acv =
                hitungACV(
                    totalKDmesin,
                    target
                );


            const barisBerikutnya =
                hasil[index + 1];


            const barisTerakhirMC =
                !barisBerikutnya ||
                barisBerikutnya.mc !== mc;


            tr.innerHTML =
                `

                <td>
                    ${escapeHTML(mc)}
                </td>

                <td>
                    ${escapeHTML(
                        row.kodeProduk
                    )}
                </td>

                <td class="angka">
                    ${formatAngka(
                        row.qty
                    )}
                    Pcs
                </td>

                <td class="angka">
                    ${formatAngka(
                        row.kd
                    )}
                    KD
                </td>

                <td class="angka">

                    ${
                        barisTerakhirMC
                        ? formatAngka(target) +
                          " KD"
                        : ""
                    }

                </td>

                <td class="acv">

                    ${
                        barisTerakhirMC
                        ? acv.toFixed(1) +
                          "%"
                        : ""
                    }

                </td>

                `;


            flatBody.appendChild(
                tr
            );

        }
    );


    /* =============================================
       BARIS TOTAL
    ============================================= */

    const totalRow =
        document.createElement(
            "tr"
        );


    totalRow.className =
        "total-row";


    totalRow.innerHTML =
        `

        <td>
            TOTAL
        </td>

        <td>
            -
        </td>

        <td class="angka">
            ${formatAngka(totalQty)}
            Pcs
        </td>

        <td class="angka">
            ${formatAngka(totalKD)}
            KD
        </td>

        <td>
            -
        </td>

        <td>
            -
        </td>

        `;


    flatBody.appendChild(
        totalRow
    );

}

function tampilkanForm(

){

        formBody.innerHTML =

                >

                    )}
                </td>

    );

}
