<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 14px;
    font-family: Arial, sans-serif;
    background: #eef3f6;
    color: #17384d;
}

.container {
    max-width: 1200px;
    margin: auto;
}

/* =========================
   HEADER
========================= */

.header {
    text-align: center;
    margin-bottom: 12px;
}

.header h1 {
    margin: 0;
    padding: 14px 10px 6px;
    font-size: 27px;
    font-weight: 900;
    color: #214b67;
    text-shadow:
        0 2px 0 #ffffff,
        0 4px 7px rgba(0,0,0,.20);
    cursor: pointer;
    user-select: none;
}

.header h1:active {
    transform: translateY(1px);
}

.subtitle {
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 2px;
    color: #53778d;
}

/* =========================
   FILTER
========================= */

.filter-panel {
    display: none;
    margin: 12px 0;
    padding: 14px;
    border-radius: 14px;
    background: linear-gradient(
        145deg,
        #ffffff,
        #dce8ef
    );
    border: 1px solid #9bb8c9;
    box-shadow:
        0 6px 12px rgba(0,0,0,.14),
        inset 0 1px 0 #ffffff;
}

.filter-panel.buka {
    display: block;
}

.filter-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.filter-item label {
    display: block;
    margin-bottom: 5px;
    font-size: 12px;
    font-weight: bold;
    color: #315c74;
}

.filter-item input,
.filter-item select {
    width: 100%;
    height: 42px;
    padding: 0 11px;
    border-radius: 10px;
    border: 1px solid #8eafc1;
    background: #ffffff;
    color: #183e53;
    font-size: 14px;
    font-weight: bold;
    outline: none;
    box-shadow:
        inset 0 2px 4px rgba(0,0,0,.08),
        0 2px 4px rgba(0,0,0,.08);
}

.filter-item input:focus,
.filter-item select:focus {
    border-color: #39779c;
    box-shadow:
        0 0 0 2px rgba(63,126,163,.15),
        inset 0 2px 4px rgba(0,0,0,.06);
}

.refresh-button {
    width: 100%;
    height: 42px;
    margin-top: 12px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(
        145deg,
        #5b91b1,
        #285b7b
    );
    color: white;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    box-shadow:
        0 4px 7px rgba(0,0,0,.20),
        inset 0 1px 0 rgba(255,255,255,.35);
}

.refresh-button:active {
    transform: translateY(2px);
    box-shadow:
        0 2px 4px rgba(0,0,0,.18),
        inset 0 1px 0 rgba(255,255,255,.25);
}

/* =========================
   INFO
========================= */

.info-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin: 12px 0;
    padding: 11px 14px;
    border-radius: 11px;
    background: linear-gradient(
        145deg,
        #ffffff,
        #dbe8ef
    );
    border: 1px solid #9db8c8;
    box-shadow:
        0 4px 8px rgba(0,0,0,.12),
        inset 0 1px 0 #ffffff;
    font-size: 13px;
    font-weight: bold;
}

.info-item {
    flex: 1;
}

.info-label {
    color: #6b8798;
    font-size: 10px;
    display: block;
    margin-bottom: 3px;
}

.info-value {
    color: #214b67;
    font-size: 14px;
}

/* =========================
   LOADING
========================= */

#loading {
    display: none;
    text-align: center;
    padding: 18px;
    margin: 10px 0;
    border-radius: 10px;
    background: #ffffff;
    color: #3c6f8a;
    font-weight: bold;
    box-shadow: 0 3px 8px rgba(0,0,0,.10);
}

/* =========================
   SECTION
========================= */

.section {
    margin-top: 15px;
    margin-bottom: 18px;
}

.section-title {
    padding: 10px 13px;
    border-radius: 10px 10px 0 0;
    background: linear-gradient(
        145deg,
        #c9e4f2,
        #9fc7dc
    );
    color: #214b67;
    font-size: 15px;
    font-weight: 900;
    border: 1px solid #82abc1;
    box-shadow:
        0 4px 8px rgba(0,0,0,.14),
        inset 0 1px 0 rgba(255,255,255,.75);
}

/* =========================
   TABLE FRAME
========================= */

.table-wrap {
    width: 100%;
    overflow-x: auto;
    border-left: 1px solid #82abc1;
    border-right: 1px solid #82abc1;
    border-bottom: 1px solid #82abc1;
    background: #f4f7f9;
    box-shadow:
        0 5px 10px rgba(0,0,0,.12),
        inset 0 1px 0 #ffffff;
}

table {
    width: 100%;
    min-width: 700px;
    border-collapse: separate;
    border-spacing: 0;
}

th {
    padding: 9px 8px;
    background: linear-gradient(
        145deg,
        #4f86a8,
        #285b7b
    );
    color: #ffffff;
    font-size: 11px;
    font-weight: 900;
    text-align: center;
    white-space: nowrap;
    border-right: 1px solid rgba(255,255,255,.22);
    border-bottom: 2px solid #204d68;
    text-shadow: 0 1px 2px rgba(0,0,0,.30);
}

td {
    padding: 8px 7px;
    font-size: 12px;
    border-right: 1px solid #d1dee5;
    border-bottom: 1px solid #d1dee5;
    background: #edf6fb;
    vertical-align: middle;
}

tbody tr:nth-child(even) td {
    background: #e4f0f6;
}

td:first-child,
th:first-child {
    border-left: none;
}

.number {
    text-align: right;
    font-weight: 900;
    white-space: nowrap;
}

.center {
    text-align: center;
}

.code {
    font-weight: 900;
    color: #244f68;
}

/* =========================
   TOTAL
========================= */

.total-row td {
    background: linear-gradient(
        145deg,
        #7ca8c1,
        #477895
    ) !important;
    color: #ffffff;
    font-weight: 900;
    border-color: #38657e;
    text-shadow: 0 1px 2px rgba(0,0,0,.25);
}

/* =========================
   SECOND TABLE
========================= */

.table-secondary {
    min-width: 560px;
}

.table-secondary td {
    background: #f3f4f5;
    color: #354650;
}

.table-secondary tbody tr:nth-child(even) td {
    background: #e9ecee;
}

.table-secondary th {
    font-size: 10px;
    padding: 8px 6px;
}

.table-secondary td {
    font-size: 11px;
    padding: 7px 6px;
}

/* =========================
   EMPTY
========================= */

.empty-row td {
    text-align: center;
    padding: 18px;
    color: #71838d;
    font-style: italic;
    background: #f4f7f9 !important;
}

/* =========================
   FOOTER
========================= */

.footer {
    text-align: center;
    margin-top: 18px;
    padding: 10px;
    font-size: 10px;
    color: #718895;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    body {
        padding: 8px;
    }

    .header h1 {
        font-size: 21px;
        padding-top: 9px;
    }

    .subtitle {
        font-size: 10px;
        letter-spacing: 1.5px;
    }

    .filter-grid {
        grid-template-columns: 1fr;
        gap: 9px;
    }

    .info-bar {
        padding: 9px 10px;
    }

    .info-label {
        font-size: 9px;
    }

    .info-value {
        font-size: 12px;
    }

    .section-title {
        font-size: 13px;
        padding: 9px 10px;
    }

    table {
        min-width: 700px;
    }

    .table-secondary {
        min-width: 560px;
    }

    th {
        font-size: 10px;
        padding: 8px 6px;
    }

    td {
        font-size: 11px;
        padding: 7px 6px;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- =========================
         HEADER
    ========================== -->

    <div class="header">

        <h1
            onclick="toggleFilter()"
            title="Ketuk untuk membuka filter"
        >
            LAPORAN PRODUKSI HARIAN
        </h1>

        <div class="subtitle">
            DEPARTEMEN PRINTING
        </div>

    </div>


    <!-- =========================
         FILTER
    ========================== -->

    <div
        id="filterPanel"
        class="filter-panel"
    >

        <div class="filter-grid">

            <div class="filter-item">
                <label for="tanggal">
                    TANGGAL
                </label>

                <input
                    type="date"
                    id="tanggal"
                >
            </div>


            <div class="filter-item">
                <label for="grup">
                    GRUP
                </label>

                <select id="grup">
                    <option value="">
                        SEMUA GRUP
                    </option>

                    <option value="A">
                        GRUP A
                    </option>

                    <option value="B">
                        GRUP B
                    </option>

                    <option value="C">
                        GRUP C
                    </option>
                </select>
            </div>

        </div>


        <button
            class="refresh-button"
            onclick="ambilData()"
        >
            ↻ REFRESH DATA
        </button>

    </div>


    <!-- =========================
         INFO
    ========================== -->

    <div class="info-bar">

        <div class="info-item">

            <span class="info-label">
                TANGGAL
            </span>

            <span
                id="infoTanggal"
                class="info-value"
            >
                -
            </span>

        </div>


        <div class="info-item">

            <span class="info-label">
                GRUP
            </span>

            <span
                id="infoGrup"
                class="info-value"
            >
                SEMUA GRUP
            </span>

        </div>

    </div>


    <!-- =========================
         LOADING
    ========================== -->

    <div id="loading">
        ⏳ Mengambil data...
    </div>


    <!-- =========================
         PRODUKSI FLATBED
    ========================== -->

    <div class="section">

        <div class="section-title">
            PRODUKSI FLATBED PRINT
        </div>

        <div class="table-wrap">

            <table>

                <thead>

                    <tr>
                        <th>MC</th>
                        <th>KODE PRODUK</th>
                        <th>QTY (Pcs)</th>
                        <th>KD</th>
                        <th>TARGET (KD)</th>
                        <th>ACV (%)</th>
                    </tr>

                </thead>

                <tbody id="flatBody">

                </tbody>

            </table>

        </div>

    </div>


    <!-- =========================
         STEAM CURING WASHING DLVR
    ========================== -->

    <div class="section">

        <div class="section-title">
            STEAM, CURING, WASHING &amp; DLVR
        </div>

        <div class="table-wrap">

            <table class="table-secondary">

                <thead>

                    <tr>
                        <th>PROSES</th>
                        <th>KODE PRODUK</th>
                        <th>QTY</th>
                        <th>SATUAN</th>
                    </tr>

                </thead>

                <tbody id="formBody">

                </tbody>

            </table>

        </div>

    </div>


    <!-- =========================
         FOOTER
    ========================== -->

    <div class="footer">
        LAPORAN PRODUKSI HARIAN • DEPARTEMEN PRINTING
    </div>

</div>


<script>

/* =====================================================
   KONFIGURASI
===================================================== */

const WEB_APP_URL =
"https://script.google.com/macros/s/AKfycbwzhYbVJLh8X6yOveOsz1mpXVoOrGTXXOzPM-zpo6_sh31tTeeM5YFT1B2SZ2xTfAdt/exec";


/* =====================================================
   TARGET MC
===================================================== */

const TARGET_MC = {
    "FLAT 1": 100,
    "FLAT 2": 100,
    "FLAT 4": 100,
    "FLAT 5": 133,
    "FLAT 6": 133,
    "FLAT 7": 133
};


/* =====================================================
   STORAGE FILTER
===================================================== */

const FILTER_STORAGE_KEY =
"LAPORAN_PRODUKSI_HARIAN_FILTER_V1";


/* =====================================================
   ELEMENT
===================================================== */

const tanggalInput =
document.getElementById("tanggal");

const grupInput =
document.getElementById("grup");

const filterPanel =
document.getElementById("filterPanel");

const infoTanggal =
document.getElementById("infoTanggal");

const infoGrup =
document.getElementById("infoGrup");

const loading =
document.getElementById("loading");

const flatBody =
document.getElementById("flatBody");

const formBody =
document.getElementById("formBody");


/* =====================================================
   STATUS FILTER
===================================================== */

let filterTerbuka = false;


/* =====================================================
   FILTER PANEL
===================================================== */

function kunciFilter() {

    filterTerbuka = false;

    filterPanel.classList.remove("buka");
}


function toggleFilter() {

    filterTerbuka = !filterTerbuka;

    if (filterTerbuka) {
        filterPanel.classList.add("buka");
    } else {
        filterPanel.classList.remove("buka");
    }
}


/* =====================================================
   TANGGAL HARI INI
===================================================== */

function tanggalHariIni() {

    const sekarang =
        new Date();

    const tahun =
        sekarang.getFullYear();

    const bulan =
        String(
            sekarang.getMonth() + 1
        ).padStart(2, "0");

    const hari =
        String(
            sekarang.getDate()
        ).padStart(2, "0");

    return `${tahun}-${bulan}-${hari}`;
}


/* =====================================================
   SIMPAN FILTER
===================================================== */

function simpanFilter() {

    const data = {
        tanggal: tanggalInput.value,
        grup: grupInput.value
    };

    try {

        localStorage.setItem(
            FILTER_STORAGE_KEY,
            JSON.stringify(data)
        );

    } catch (error) {

        console.warn(
            "Filter tidak dapat disimpan:",
            error
        );
    }
}


/* =====================================================
   AMBIL FILTER TERSIMPAN
===================================================== */

function ambilFilterTersimpan() {

    try {

        const tersimpan =
            localStorage.getItem(
                FILTER_STORAGE_KEY
            );

        if (!tersimpan) {
            return null;
        }

        const data =
            JSON.parse(tersimpan);

        if (!data || typeof data !== "object") {
            return null;
        }

        return data;

    } catch (error) {

        console.warn(
            "Filter tersimpan tidak dapat dibaca:",
            error
        );

        return null;
    }
}


/* =====================================================
   FORMAT TANGGAL INDONESIA
===================================================== */

function formatTanggalIndonesia(
    tanggal
) {

    if (!tanggal) {
        return "-";
    }

    const bagian =
        tanggal.split("-");

    if (bagian.length !== 3) {
        return tanggal;
    }

    const tahun =
        bagian[0];

    const bulan =
        Number(bagian[1]);

    const hari =
        bagian[2];

    const namaBulan = [
        "",
        "Januari",
        "Februari",
        "Maret",
        "April",
        "Mei",
        "Juni",
        "Juli",
        "Agustus",
        "September",
        "Oktober",
        "November",
        "Desember"
    ];

    return `${hari} ${namaBulan[bulan]} ${tahun}`;
}


/* =====================================================
   UPDATE INFO
===================================================== */

function updateInfo() {

    infoTanggal.textContent =
        formatTanggalIndonesia(
            tanggalInput.value
        );


    if (grupInput.value) {

        infoGrup.textContent =
            "GRUP " +
            grupInput.value;

    } else {

        infoGrup.textContent =
            "SEMUA GRUP";
    }
}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =====================================================
   FORMAT ANGKA
===================================================== */

function formatAngka(value) {

    const angka =
        Number(value) || 0;

    return angka.toLocaleString(
        "id-ID"
    );
}


/* =====================================================
   TARGET MC
===================================================== */

function ambilTargetMC(mc) {

    const nama =
        String(mc || "")
            .trim()
            .toUpperCase();

    if (
        TARGET_MC[nama] !== undefined
    ) {
        return TARGET_MC[nama];
    }

    return 0;
}


/* =====================================================
   HITUNG ACV
===================================================== */

function hitungACV(
    totalKD,
    target
) {

    if (!target) {
        return 0;
    }

    return (
        Number(totalKD || 0) /
        Number(target || 0)
    ) * 100;
}


/* =====================================================
   AMBIL DATA
===================================================== */

async function ambilData() {

    loading.style.display =
        "block";

    loading.textContent =
        "⏳ Mengambil data...";


    flatBody.innerHTML = "";
    formBody.innerHTML = "";


    const tanggal =
        tanggalInput.value;

    const grup =
        grupInput.value;


    /*
       Simpan pilihan terbaru.
       Tidak mereset filter.
    */

    simpanFilter();


    updateInfo();


    try {

        const urlFlat =
            WEB_APP_URL +
            "?action=flat" +
            "&tanggal=" +
            encodeURIComponent(tanggal) +
            "&grup=" +
            encodeURIComponent(grup);


        const urlForm =
            WEB_APP_URL +
            "?action=form" +
            "&tanggal=" +
            encodeURIComponent(tanggal) +
            "&grup=" +
            encodeURIComponent(grup);


        const [
            responseFlat,
            responseForm
        ] = await Promise.all([

            fetch(urlFlat),

            fetch(urlForm)

        ]);


        if (!responseFlat.ok) {

            throw new Error(
                "Gagal mengambil data FLAT"
            );
        }


        if (!responseForm.ok) {

            throw new Error(
                "Gagal mengambil data FORM"
            );
        }


        const [
            dataFlat,
            dataForm
        ] = await Promise.all([

            responseFlat.json(),

            responseForm.json()

        ]);


        tampilkanFlat(
            dataFlat
        );


        tampilkanForm(
            dataForm
        );


        loading.style.display =
            "none";


    } catch (error) {

        console.error(error);

        loading.textContent =
            "❌ Gagal mengambil data. Silakan coba refresh.";

    }
}


/* =====================================================
   TAMPILKAN FLAT
===================================================== */

function tampilkanFlat(data) {

    flatBody.innerHTML = "";


    let rows = [];


    /*
       Apps Script bisa mengembalikan
       array langsung atau object.
    */

    if (Array.isArray(data)) {

        rows = data;

    } else if (
        data &&
        Array.isArray(data.data)
    ) {

        rows = data.data;

    } else if (
        data &&
        Array.isArray(data.rows)
    ) {

        rows = data.rows;

    }


    if (!rows.length) {

        flatBody.innerHTML = `
            <tr class="empty-row">
                <td colspan="6">
                    Tidak ada data produksi FLAT
                    untuk filter yang dipilih.
                </td>
            </tr>
        `;

        return;
    }


    /*
       GROUPING:
       MC + KODE PRODUK
    */

    const grouped =
        {};


    rows.forEach(row => {

        /*
           Mendukung format array:
           A = TANGGAL
           B = MC
           C = GRUP
           D = KODE PRODUK
           E = QTY
           F = KD

           Juga mendukung object
           jika Apps Script mengembalikan header.
        */

        let mc;
        let kode;
        let qty;
        let kd;


        if (Array.isArray(row)) {

            mc =
                row[1];

            kode =
                row[3];

            qty =
                row[4];

            kd =
                row[5];

        } else {

            mc =
                row.MC ??
                row.mc ??
                row["MC"] ??
                "";

            kode =
                row["KODE PRODUK"] ??
                row.kodeProduk ??
                row.kode ??
                "";

            qty =
                row["QTY (PCS)"] ??
                row.QTY ??
                row.qty ??
                0;

            kd =
                row.KD ??
                row.kd ??
                0;
        }


        mc =
            String(mc ?? "")
                .trim();

        kode =
            String(kode ?? "")
                .trim();


        if (!mc) {
            return;
        }


        const key =
            mc +
            "||" +
            kode;


        if (!grouped[key]) {

            grouped[key] = {

                mc: mc,

                kode: kode,

                qty: 0,

                kd: 0
            };
        }


        grouped[key].qty +=
            Number(qty) || 0;

        grouped[key].kd +=
            Number(kd) || 0;

    });


    const groupedRows =
        Object.values(grouped);


    if (!groupedRows.length) {

        flatBody.innerHTML = `
            <tr class="empty-row">
                <td colspan="6">
                    Tidak ada data produksi FLAT
                    untuk filter yang dipilih.
                </td>
            </tr>
        `;

        return;
    }


    /*
       SORT MC lalu KODE
    */

    groupedRows.sort(
        (a, b) => {

            const mcCompare =
                a.mc.localeCompare(
                    b.mc,
                    undefined,
                    {
                        numeric: true
                    }
                );

            if (mcCompare !== 0) {
                return mcCompare;
            }

            return a.kode.localeCompare(
                b.kode,
                undefined,
                {
                    numeric: true
                }
            );
        }
    );


    /*
       TOTAL PER MC
    */

    const totalPerMC =
        {};


    groupedRows.forEach(item => {

        if (!totalPerMC[item.mc]) {

            totalPerMC[item.mc] = {
                qty: 0,
                kd: 0
            };
        }


        totalPerMC[item.mc].qty +=
            item.qty;

        totalPerMC[item.mc].kd +=
            item.kd;
    });


    /*
       BUILD TABLE
    */

    let html = "";


    groupedRows.forEach(
        (item, index) => {

            const next =
                groupedRows[index + 1];


            const lastOfMC =
                !next ||
                next.mc !== item.mc;


            let targetHTML = "-";
            let acvHTML = "-";


            if (lastOfMC) {

                const target =
                    ambilTargetMC(
                        item.mc
                    );


                const acv =
                    hitungACV(
                        totalPerMC[item.mc].kd,
                        target
                    );


                targetHTML =
                    target
                        ? `<strong>${formatAngka(target)} KD</strong>`
                        : "-";


                acvHTML =
                    target
                        ? `<strong>${acv.toFixed(1)}%</strong>`
                        : "-";
            }


            html += `
                <tr>

                    <td class="center">
                        <strong>
                            ${escapeHTML(item.mc)}
                        </strong>
                    </td>

                    <td class="code">
                        ${escapeHTML(item.kode || "-")}
                    </td>

                    <td class="number">
                        ${formatAngka(item.qty)}
                        Pcs
                    </td>

                    <td class="number">
                        ${formatAngka(item.kd)}
                        KD
                    </td>

                    <td class="number">
                        ${targetHTML}
                    </td>

                    <td class="number">
                        ${acvHTML}
                    </td>

                </tr>
            `;
        }
    );


    /*
       TOTAL KESELURUHAN
    */

    let totalQty = 0;
    let totalKD = 0;


    groupedRows.forEach(item => {

        totalQty +=
            item.qty;

        totalKD +=
            item.kd;
    });


    html += `
        <tr class="total-row">

            <td class="center">
                TOTAL
            </td>

            <td class="center">
                -
            </td>

            <td class="number">
                ${formatAngka(totalQty)}
                Pcs
            </td>

            <td class="number">
                ${formatAngka(totalKD)}
                KD
            </td>

            <td class="center">
                -
            </td>

            <td class="center">
                -
            </td>

        </tr>
    `;


    flatBody.innerHTML =
        html;
}


/* =====================================================
   TAMPILKAN FORM RESPONSES 5
===================================================== */

function tampilkanForm(data) {

    formBody.innerHTML = "";


    let rows = [];


    if (Array.isArray(data)) {

        rows = data;

    } else if (
        data &&
        Array.isArray(data.data)
    ) {

        rows = data.data;

    } else if (
        data &&
        Array.isArray(data.rows)
    ) {

        rows = data.rows;

    }


    if (!rows.length) {

        formBody.innerHTML = `
            <tr class="empty-row">
                <td colspan="4">
                    Tidak ada data
                    STEAM, CURING, WASHING
                    &amp; DLVR untuk filter
                    yang dipilih.
                </td>
            </tr>
        `;

        return;
    }


    let html = "";


    rows.forEach(row => {

        let proses;
        let kode;
        let qty;
        let satuan;


        if (Array.isArray(row)) {

            /*
               Form Responses 5:
               A = Timestamp
               B = PROSES
               C = KODE PRODUK
               D = QTY
               E = SATUAN
               F = GRUP
               G = CATATAN
               H = TANGGAL
            */

            proses =
                row[1];

            kode =
                row[2];

            qty =
                row[3];

            satuan =
                row[4];

        } else {

            proses =
                row.PROSES ??
                row.proses ??
                "";

            kode =
                row["KODE PRODUK"] ??
                row.kodeProduk ??
                row.kode ??
                "";

            qty =
                row.QTY ??
                row.qty ??
                "";

            satuan =
                row.SATUAN ??
                row.satuan ??
                "";
        }


        html += `
            <tr>

                <td>
                    <strong>
                        ${escapeHTML(proses || "-")}
                    </strong>
                </td>

                <td class="code">
                    ${escapeHTML(kode || "-")}
                </td>

                <td class="number">
                    ${escapeHTML(qty || "-")}
                </td>

                <td class="center">
                    ${escapeHTML(satuan || "-")}
                </td>

            </tr>
        `;
    });


    formBody.innerHTML =
        html;
}


/* =====================================================
   EVENT FILTER TANGGAL
===================================================== */

tanggalInput.addEventListener(
    "change",
    function() {

        simpanFilter();

        updateInfo();

        ambilData();
    }
);


/* =====================================================
   EVENT FILTER GRUP
===================================================== */

grupInput.addEventListener(
    "change",
    function() {

        simpanFilter();

        updateInfo();

        ambilData();
    }
);


/* =====================================================
   STARTUP
===================================================== */

(function mulai() {

    /*
       Tutup panel filter saat awal.
       Hanya panel yang ditutup,
       bukan filter yang di-reset.
    */

    kunciFilter();


    /*
       Ambil filter terakhir.
    */

    const tersimpan =
        ambilFilterTersimpan();


    if (
        tersimpan &&
        tersimpan.tanggal
    ) {

        tanggalInput.value =
            tersimpan.tanggal;

        grupInput.value =
            tersimpan.grup || "";

    } else {

        tanggalInput.value =
            tanggalHariIni();

        grupInput.value =
            "";
    }


    /*
       Update tulisan info.
    */

    updateInfo();


    /*
       Ambil data menggunakan
       filter terakhir.
    */

    ambilData();

})();

</script>
